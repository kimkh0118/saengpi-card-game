<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>생피 카드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed-size game console screen (landscape 1200x760 or portrait 700x1000) scaled to fit the window, so everything is always on one screen. */
:root{
  --bg:#dfe7da; --surface:#f6f8f2; --surface2:#ebf0e6; --ink:#1b2a20; --muted:#5a6b5f; --line:#c3cfbd;
  --accent:#2f7d4f; --sun:#c98a12; --danger:#c0412c; --sky:#2f6f98; --shield:#3a6fb0;
  --tb:#fbfcf8; --tbline:#26342b;
  --lv0:#4f9a3a; --lv1:#93ad2c; --lv2:#2b958a; --lv3:#b9832a; --lv4:#8a4b3a;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(27,42,32,.06),0 6px 16px -8px rgba(27,42,32,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1510; --surface:#17211a; --surface2:#1e2a21; --ink:#e3ece1; --muted:#97aa99; --line:#2e3d32;
  --accent:#5fbf7f; --sun:#e6b04a; --danger:#ec7a62; --sky:#73b2da; --shield:#7aa6e6;
  --tb:#121a15; --tbline:#a9bfad;
  --lv0:#6cbf55; --lv1:#b5cc4a; --lv2:#45bdb0; --lv3:#dba64a; --lv4:#c07a63;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1510; --surface:#17211a; --surface2:#1e2a21; --ink:#e3ece1; --muted:#97aa99; --line:#2e3d32;
  --accent:#5fbf7f; --sun:#e6b04a; --danger:#ec7a62; --sky:#73b2da; --shield:#7aa6e6;
  --tb:#121a15; --tbline:#a9bfad;
  --lv0:#6cbf55; --lv1:#b5cc4a; --lv2:#45bdb0; --lv3:#dba64a; --lv4:#c07a63;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- fixed game canvas ---------- */
.app{position:fixed;left:0;top:0;transform-origin:0 0;padding:10px;display:grid;gap:8px;
  width:1200px;height:760px;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:32px auto auto minmax(0,1fr) 192px;
  grid-template-areas:"top top" "field stat" "field fac" "field ." "hand hand"}
.app.portrait{width:700px;height:1000px;grid-template-columns:1fr 1fr;grid-template-rows:32px 500px auto minmax(0,1fr);
  grid-template-areas:"top top" "field field" "stat fac" "hand hand"}
.top{grid-area:top}.field{grid-area:field}#pStat{grid-area:stat}#pFac{grid-area:fac}.handzone{grid-area:hand}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait .brand small{display:none}
.toolbar{display:flex;gap:6px;align-items:center}
.pill{font-family:var(--display);font-size:14px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.ghost:hover{background:var(--surface)}
.ghost.warn{color:var(--danger)}

/* ---------- battle field ---------- */
.field{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:3px solid var(--tbline);background:#9fd2ea;isolation:isolate}
.field.shake{animation:fshake .45s}
@keyframes fshake{15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0;pointer-events:none;transition:opacity .7s;opacity:0}
.l-dark{background:#0a0f22}
.l-cold{background:linear-gradient(180deg,rgba(130,190,255,.55),rgba(220,240,255,.35))}
.l-hot{background:linear-gradient(180deg,rgba(255,110,30,.45),rgba(255,210,90,.25))}
.l-dry{background:linear-gradient(180deg,transparent 58%,rgba(176,124,62,.85) 60%)}
.l-acid{background:linear-gradient(180deg,transparent 58%,rgba(124,64,160,.55) 60%)}
.l-rich{background:linear-gradient(180deg,transparent 58%,rgba(70,45,20,.35) 60%)}
.l-bright{background:radial-gradient(circle at 10% 8%,rgba(255,236,140,.9),transparent 38%)}
.parts span{position:absolute;top:-8%;font-size:15px;color:#fff;animation:fall linear infinite}
.rain span{width:2px;height:18px;background:rgba(70,130,220,.75);font-size:0;animation-duration:.6s!important}
@keyframes fall{to{transform:translateY(700px)}}

.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#b9e08f 0%,#86bd5c 55%,rgba(60,100,40,0) 72%)}
.e-plat{right:5%;top:40%;width:34%;height:12%}
.p-plat{left:1%;bottom:20%;width:52%;height:16%}

.alien{position:absolute;right:11%;top:4%;height:42%;aspect-ratio:160/175;animation:hover 2.4s ease-in-out infinite;transform-origin:50% 100%}
.alien svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes hover{50%{transform:translateY(-6px)}}
.alien.hit svg{animation:hitflash .55s steps(2)}
@keyframes hitflash{0%,50%{opacity:.15;filter:brightness(3)}25%,75%,100%{opacity:1}}
.alien.faint{animation:faint .9s ease forwards}
@keyframes faint{to{transform:translateY(80px) scaleY(.4);opacity:0}}
.alien.enter{animation:enter .8s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateX(150%)}}
.alien.charge svg{animation:charge .6s ease}
@keyframes charge{40%{transform:scale(1.12) translateY(-6px);filter:drop-shadow(0 0 14px var(--glow))}}

.eco{position:absolute;left:3%;bottom:23%;width:48%;height:52%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.eco.hit{animation:hitflash .55s steps(2)}
.eco.faint{animation:faint .9s ease forwards}
.erow{display:flex;align-items:center;justify-content:center;gap:2px;line-height:1;position:relative}
.erow .ic{display:inline-block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.erow .ic.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(0)}}
.erow .ic.bob{animation:ebob 1.6s ease-in-out infinite}
@keyframes ebob{50%{transform:translateY(-3px)}}
.erow .badge{font-family:var(--display);font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.erow[data-lv="4"]{font-size:36px} .erow[data-lv="3"]{font-size:30px} .erow[data-lv="2"]{font-size:27px} .erow[data-lv="1"]{font-size:23px} .erow[data-lv="0"]{font-size:21px}

.infobox{position:absolute;background:var(--tb);border:2px solid var(--tbline);border-radius:12px 3px 12px 3px;padding:5px 10px 6px;box-shadow:var(--shadow);z-index:3}
.e-box{left:3%;top:5%;width:min(42%,260px)}
.p-box{right:3%;bottom:calc(74px + 8%);width:min(44%,270px)}
.infobox .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.infobox b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.infobox .lv{font-size:11px;color:var(--muted);white-space:nowrap}
.hprow{display:flex;align-items:center;gap:6px;margin-top:3px}
.hprow .hl{font-size:10px;font-weight:700;color:var(--sun)}
.hp{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:#3fae5a;transition:width .7s ease}
.hp i.mid{background:#e0a92a} .hp i.low{background:#d9452c}
.hpn{text-align:right;font-family:var(--display);font-size:14px;line-height:1.1;margin-top:1px}
.shieldtag{font-size:11px;color:var(--shield);font-weight:700;white-space:nowrap}

.textbox{position:absolute;left:1.5%;right:1.5%;bottom:10px;height:74px;background:var(--tb);border:3px double var(--tbline);border-radius:10px;
  padding:7px 34px 6px 14px;font-family:var(--display);font-size:18px;line-height:1.3;cursor:pointer;z-index:4;overflow:hidden}
.textbox small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.arrow{position:absolute;right:12px;bottom:6px;font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--display);font-size:42px;color:#fff;
  -webkit-text-stroke:1.5px var(--tbline);text-shadow:0 3px 0 var(--tbline);pointer-events:none;z-index:5;opacity:0}
.banner.on{animation:banner 1.2s ease}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.tint{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0}
.tint.on{animation:tint .8s ease}
@keyframes tint{25%{opacity:.55}100%{opacity:0}}
.proj{position:absolute;z-index:4;pointer-events:none;font-size:26px;line-height:1}
.boom{position:absolute;z-index:4;pointer-events:none;font-size:44px;transform:translate(-50%,-50%);animation:boom .5s ease-out forwards}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.laser{position:absolute;height:8px;border-radius:4px;transform-origin:0 50%;z-index:4;pointer-events:none;box-shadow:0 0 12px 4px var(--glow)}
.floater{position:absolute;font-family:var(--display);font-size:26px;pointer-events:none;z-index:6;transform:translate(-50%,-50%);animation:floatUp 1.1s ease-out forwards;
  -webkit-text-stroke:1px var(--tb);paint-order:stroke}
.floater.dmg{color:var(--danger)} .floater.good{color:#2f9a52} .floater.info{color:var(--sky);font-size:18px}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,calc(-50% - 44px))}}

/* ---------- status panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;min-height:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:16px;margin:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.chip{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip.ok{border-color:var(--accent);color:var(--accent)} .chip.bad{border-color:var(--danger);color:var(--danger)}
.stat{width:100%;border-collapse:collapse;font-size:12px}
.stat td{padding:1px 0;white-space:nowrap}
.stat td.n{text-align:right;font-variant-numeric:tabular-nums}
.stat .cnt{font-family:var(--display);font-size:15px}
.stat .nx{color:var(--muted);font-size:11px}
.stat .up{color:var(--accent)} .stat .down{color:var(--danger)}
.stat .bad{color:var(--danger);font-weight:700;font-size:11px} .stat .ok{color:var(--muted);font-size:11px}
.stat tr.flash td{background:var(--surface2)}
.foot{display:flex;justify-content:space-between;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:14px}
.facs{display:flex;flex-direction:column;gap:4px}
.fac{display:grid;grid-template-columns:48px 1fr 24px 58px;gap:6px;align-items:center;font-size:12px}
.gauge{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.gauge i{height:6px;border-radius:2px;background:var(--line)}
.gauge i.mid{background:var(--muted);opacity:.45} .gauge i.pos{background:var(--accent)} .gauge i.neg{background:var(--danger)}
.fac b{font-family:var(--display);font-weight:400;font-size:14px;text-align:right}
.fac .eff{font-size:11px;text-align:right;white-space:nowrap}
.fac .eff.good{color:var(--accent)} .fac .eff.bad{color:var(--danger);font-weight:700}
.gauge i.opt{outline:1.5px solid var(--sun);outline-offset:1px}
.stat .warn{color:var(--sun);font-weight:700;font-size:11px}
.stat .atk{color:var(--muted);font-size:10.5px}
.facnote{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}
.mbar{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.mbar i{width:12px;height:5px;border-radius:3px;background:var(--line)} .mbar i.on{background:var(--sun)}

/* ---------- hand strip ---------- */
.handzone{display:grid;grid-template-columns:92px minmax(0,1fr) 112px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:0}
.deck{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.deck:disabled{cursor:default}
.stack{position:relative;width:70px;height:96px}
.back{position:absolute;inset:0;border-radius:10px;border:2px solid var(--tbline);
  background:repeating-linear-gradient(45deg,#2f7d4f 0 7px,#3f9a62 7px 14px);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow)}
.back:nth-child(1){transform:translate(5px,5px)} .back:nth-child(2){transform:translate(2.5px,2.5px)}
.deck:not(:disabled) .stack{animation:dbob 1.3s ease-in-out infinite}
.deck:not(:disabled) .back:last-child{box-shadow:0 0 0 3px var(--sun),var(--shadow)}
@keyframes dbob{50%{transform:translateY(-4px)}}
.deck:disabled .stack{opacity:.5}
.decklabel{font-family:var(--display);font-size:13px;text-align:center;line-height:1.15}
.decklabel small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted)}
.draws{display:inline-block;background:var(--sun);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 6px;align-items:center;height:100%}
.hand .empty{color:var(--muted);font-size:13px}
.card{flex:0 0 116px;height:166px;position:relative;text-align:left;border:2px solid var(--cc);border-radius:10px;background:var(--surface);padding:5px 7px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .15s ease;overflow:hidden}
.card:hover:not(:disabled){transform:translateY(-6px)}
.card:disabled{cursor:not-allowed}
.card:disabled > :not(.why){opacity:.4}
.card .ct{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--cc)}
.card .art{flex:1 1 auto;min-height:22px;border-radius:7px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--cc) 18%,var(--surface))}
.card .cn{font-family:var(--display);font-size:15px;line-height:1.1}
.card .ce{font-size:11px;font-weight:700;color:var(--cc);line-height:1.25}
.card .ce .cost{color:var(--danger)}
.card .cx{font-size:10px;line-height:1.3;color:var(--ink);background:var(--surface2);border-radius:5px;padding:2px 4px}
.card .why{font-size:10px;color:var(--danger);font-weight:700;line-height:1.2}
.card.drawn{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:translateX(-140px) rotateY(90deg);opacity:0}}
.endcol{display:flex;flex-direction:column;gap:6px}
.rule{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.35}
.rule b{color:var(--ink)}
.endbtn{font-family:var(--display);font-size:17px;padding:10px 8px;border-radius:10px;border:0;background:var(--danger);color:#fff;cursor:pointer;box-shadow:var(--shadow)}
.endbtn.go{background:var(--accent)}
.endbtn:disabled{opacity:.45;cursor:default}

/* ---------- story ---------- */
.story{position:absolute;inset:0;z-index:40;background:#0b1220;overflow:hidden;cursor:pointer;border-radius:4px}
.story .scene{position:absolute;inset:0;overflow:hidden}
.story .bgsvg{transition:filter .6s}
.story.dark .bgsvg{filter:brightness(.35) saturate(.6) hue-rotate(200deg)}
.stext{position:absolute;left:4%;right:4%;bottom:5%;min-height:120px;background:var(--tb);border:4px double var(--tbline);border-radius:14px;padding:16px 46px 16px 22px;
  font-family:var(--display);font-size:24px;line-height:1.45;color:var(--ink);z-index:3}
.speaker{position:absolute;top:-18px;left:18px;background:var(--tbline);color:var(--tb);font-family:var(--display);font-size:16px;padding:2px 12px;border-radius:8px}
.skip{position:absolute;top:14px;right:14px;z-index:4;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.sdots{position:absolute;top:18px;left:18px;z-index:4;display:flex;gap:5px}
.sdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)} .sdots i.on{background:#fff}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3;text-align:center}
.title h2{font-family:var(--display);font-weight:400;font-size:84px;line-height:1;margin:0;color:#fff;-webkit-text-stroke:3px #1f3a26;paint-order:stroke;text-shadow:0 6px 0 #1f3a26}
.title p{font-family:var(--display);font-size:24px;margin:0;color:#fff;-webkit-text-stroke:1px #1f3a26;paint-order:stroke}
.title .startbtn{font-family:var(--display);font-size:26px;padding:12px 38px;border-radius:14px;border:3px solid #1f3a26;background:#f2c94c;color:#1f3a26;cursor:pointer;box-shadow:0 6px 0 #1f3a26;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.sc-center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.sc-row{display:flex;gap:4px;line-height:1}
.ufo{position:absolute;left:50%;top:6%;width:46%;transform:translateX(-50%);z-index:2}
.ufo.down{animation:ufoDown 2.2s cubic-bezier(.2,.8,.2,1) both}
.ufo.up{animation:ufoUp 2.4s ease-in both}
@keyframes ufoDown{from{transform:translate(-50%,-160%) scale(.4)}}
@keyframes ufoUp{to{transform:translate(60%,-220%) scale(.2) rotate(-12deg)}}
.beam2{position:absolute;left:50%;top:22%;width:38%;height:50%;transform:translateX(-50%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(150,255,220,.75),rgba(150,255,220,0));animation:beamPulse 1.2s ease-in-out infinite;animation-delay:1.6s;opacity:0;animation-fill-mode:both}
@keyframes beamPulse{0%,100%{opacity:.45}50%{opacity:.85}}
.bigalien{position:absolute;left:50%;top:6%;height:56%;aspect-ratio:160/175;transform:translateX(-50%);animation:hover 2.4s ease-in-out infinite}
.bigalien svg{width:100%;height:100%;overflow:visible}
.orbit{position:absolute;left:50%;top:32%;width:0;height:0;animation:spin 6s linear infinite}
.orbit span{position:absolute;font-size:40px;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{font-size:120px;line-height:1}
.pyr2{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr2 div{height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-family:var(--display);font-size:20px;border:2px solid rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,1.4,.4,1) backwards}

/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:100%;overflow-y:auto;padding:20px 22px;box-shadow:var(--shadow);font-size:14px}
.dlg h2{font-family:var(--display);font-weight:400;font-size:27px;margin:0 0 6px;text-wrap:balance}
.dlg h3{font-family:var(--display);font-weight:400;font-size:18px;margin:12px 0 4px}
.dlg p,.dlg li{max-width:65ch}
.dlg ul{padding-left:18px;margin:4px 0}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlg .endbtn{padding:10px 22px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.chain span{padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.lesson{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>생피 카드게임</h1><small>먹이 사슬로 외계인을 물리치는 생태계 카드 배틀</small></div>
    <div class="toolbar">
      <span class="pill num" id="stagePill"></span>
      <button class="ghost" id="btnHelp" type="button">규칙</button>
      <button class="ghost warn" id="btnForfeit" type="button">기권</button>
    </div>
  </header>

  <div class="field" id="field">
    <div id="fieldBg"></div>
    <div class="layer l-rich" id="wRich"></div>
    <div class="layer l-dry" id="wDry"></div>
    <div class="layer l-acid" id="wAcid"></div>
    <div class="layer l-bright" id="wBright"></div>
    <div class="layer l-dark" id="wDark"></div>
    <div class="layer l-cold" id="wCold"></div>
    <div class="layer parts" id="wSnow"></div>
    <div class="layer l-hot" id="wHot"></div>
    <div class="layer parts rain" id="wRain"></div>
    <div class="plat e-plat"></div>
    <div class="plat p-plat"></div>
    <div class="alien" id="alien"></div>
    <div class="eco" id="eco"></div>
    <div class="infobox e-box">
      <div class="nm"><b id="eName"></b><span class="lv">외계인</span></div>
      <div class="hprow"><span class="hl">HP</span><div class="hp"><i id="eHp"></i></div></div>
      <div class="hpn num" id="eHpN"></div>
    </div>
    <div class="infobox p-box">
      <div class="nm"><b>나의 생태계</b><span class="shieldtag" id="pShield"></span></div>
      <div class="hprow"><span class="hl">HP</span><div class="hp"><i id="pHp"></i></div></div>
      <div class="hpn num" id="pHpN"></div>
    </div>
    <div class="tint" id="tint"></div>
    <div class="banner" id="banner"></div>
    <div class="textbox" id="textbox" role="status" aria-live="polite"><div id="msg"></div><span class="arrow" id="arrow" hidden>▼</span></div>
  </div>

  <div class="panel" id="pStat">
    <div class="phead"><h2>생태계 현황</h2><span class="chip" id="balChip"></span></div>
    <table class="stat" id="stat"></table>
    <div class="foot"><span>턴 끝 공격력 <b class="num" id="dmgPrev">0</b></span><span>→ 다음 턴 예상</span></div>
  </div>
  <div class="panel" id="pFac">
    <div class="phead"><h2>비생물 요소</h2><span class="chip" id="growChip"></span></div>
    <div class="facs" id="facs"></div>
    <div class="facnote" id="facNote"></div>
  </div>

  <section class="handzone">
    <button class="deck" id="deck" type="button" aria-label="카드 뽑기">
      <div class="stack"><div class="back">🌿</div><div class="back">🌿</div><div class="back">🌿</div></div>
      <div class="decklabel" id="deckLabel"></div>
    </button>
    <div class="hand" id="hand"></div>
    <div class="endcol">
      <div class="rule" id="ruleBox"></div>
      <button class="endbtn" id="btnEnd" type="button">턴 종료</button>
    </div>
  </section>

  <div class="story" id="story" hidden>
    <div class="scene" id="scene"></div>
    <div class="sdots" id="sdots"></div>
    <button class="skip" id="skip" type="button">건너뛰기 ▶▶</button>
    <div class="stext" id="stextBox"><span class="speaker" id="speaker" hidden></span><div id="stext"></div><span class="arrow" id="sarrow" hidden>▼</span></div>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
// ================= 데이터 =================
const LV = [
  {name:'풀', role:'생산자', icon:'🌿', atk:0, r:0, cap:40, ecto:false, show:12, per:3},
  {name:'메뚜기', role:'1차 소비자', icon:'🦗', atk:0.5, r:0.6, cap:24, ecto:true, show:9, per:1},
  {name:'개구리', role:'2차 소비자', icon:'🐸', atk:1, r:0.5, cap:14, ecto:true, show:7, per:1},
  {name:'뱀', role:'3차 소비자', icon:'🐍', atk:3, r:0.4, cap:8, ecto:true, show:5, per:1},
  {name:'매', role:'최종 소비자', icon:'🦅', atk:5, r:0.35, cap:4, ecto:false, show:4, per:1},
];
const FAC = {light:{name:'빛',icon:'☀️'}, water:{name:'물',icon:'💧'}, soil:{name:'토양',icon:'🪱'}, temp:{name:'온도',icon:'🌡️'}};
const CARDS = {
  seed:  {name:'풀 씨앗', type:'bio', lv:0, n:6, icon:'🌱', sci:'생산자는 광합성으로 양분을 스스로 만들어요. 모든 먹이 사슬의 출발점이에요.'},
  hopper:{name:'메뚜기 무리', type:'bio', lv:1, n:5, icon:'🦗', sci:'메뚜기는 풀을 먹는 1차 소비자예요. 들어오자마자 풀을 먹어요.'},
  frog:  {name:'개구리', type:'bio', lv:2, n:3, icon:'🐸', sci:'개구리는 메뚜기를 먹는 2차 소비자예요. 변온동물이라 추위에 약해요.'},
  snake: {name:'뱀', type:'bio', lv:3, n:2, icon:'🐍', sci:'뱀은 개구리를 먹는 3차 소비자예요.'},
  hawk:  {name:'매', type:'bio', lv:4, n:1, icon:'🦅', sci:'매는 뱀을 먹는 최종 소비자예요. 가장 강하지만 가장 적게 살 수 있어요.'},
  sun:   {name:'맑은 햇빛', type:'abio', factor:'light', amt:1, icon:'☀️', eff:'빛 +1', sci:'빛이 많으면 광합성이 활발해져 풀이 더 자라요.'},
  rain:  {name:'단비', type:'abio', factor:'water', amt:1, icon:'🌧️', eff:'물 +1 · 풀 +3', sci:'물은 광합성의 재료예요.'},
  soil:  {name:'비옥한 토양', type:'abio', factor:'soil', amt:1, icon:'🪱', eff:'토양 +1', sci:'분해자가 만든 양분 많은 흙은 식물을 잘 자라게 해요.'},
  spring:{name:'따뜻한 햇살', type:'abio', factor:'temp', amt:1, icon:'🌤️', eff:'온도 +1', sci:'알맞게 따뜻하면 변온동물(메뚜기·개구리·뱀)이 활발해져요.'},
  breeze:{name:'시원한 바람', type:'abio', factor:'temp', amt:-1, icon:'🍃', eff:'온도 −1', sci:'너무 더울 때 온도를 낮춰 풀이 시드는 것을 막아요.'},
};
const INFO={seed:'⚔️ 공격 0 · 모든 생물의 먹이',
  sun:'🌿 빛 1당 풀 생장 +2/턴<br>적정: 빛 0 이상',
  rain:'🌿 물 1당 풀 생장 +2/턴<br>적정: 물 0 이상',
  soil:'🌿 토양 1당 풀 생장 +1/턴<br>적정: 토양 0 이상',
  spring:'🌡️ 적정 온도 0 ~ +1<br>+1이면 변온동물 번식 +1',
  breeze:'🌡️ +2 이상은 폭염(풀 −3)<br>적정 0 ~ +1로 낮춰요'};
for(const [id,c] of Object.entries(CARDS)) if(c.type==='bio'&&c.lv>0) INFO[id]=`⚔️ 공격 ${LV[c.lv].atk}/마리 (+${LV[c.lv].atk*c.n})<br>적정: ${LV[c.lv-1].name} ≥ ${LV[c.lv].name}×2`;
for(const c of Object.values(CARDS)) if(c.type==='bio') c.eff = `${LV[c.lv].name} +${c.n}` + (c.lv?` · <span class="cost">${LV[c.lv-1].name} −${c.n}</span>`:'');
const DECK = ['seed','seed','seed','hopper','hopper','hopper','hopper','hopper','hopper','hopper','frog','frog','frog','frog','snake','snake','snake','hawk','hawk',
  'sun','sun','sun','rain','rain','rain','soil','soil','spring','spring','breeze','breeze'];

// 외계인의 특수 능력 (비생물 요소 조작)
const ABIL = {
  shade:{name:'일식 장막', col:'#1b1f3a', say:'하늘이 어두워졌다! 빛 −2', sci:'빛이 줄면 광합성이 줄어 풀이 덜 자라요.', apply(){addMod('light',-2)}},
  drain:{name:'수분 흡수', col:'#b27a3a', say:'땅이 바싹 메말랐다! 물 −2', sci:'물이 없으면 광합성을 못 해서 풀이 덜 자라요.', apply(){addMod('water',-2)}},
  freeze:{name:'절대 영도', col:'#6fb6ff', say:'기온이 뚝 떨어졌다! 온도 −2', sci:'변온동물(메뚜기·개구리·뱀)은 추우면 번식을 못 하고 힘이 절반이 돼요.', apply(){addMod('temp',-2)}},
  heat:{name:'태양 증폭기', col:'#ff7a2a', say:'땅이 뜨겁게 달아올랐다! 온도 +2, 물 −1', sci:'너무 더우면 풀이 시들고 물이 증발해요.', apply(){addMod('temp',2);addMod('water',-1)}},
  acid:{name:'산성비 구름', col:'#8a4bb5', say:'산성비가 흙을 망가뜨렸다! 토양 −2', sci:'산성비는 흙의 양분을 씻어내 식물이 자라기 어렵게 해요.', apply(){addMod('soil',-2)}},
  frost:{name:'서리 폭풍', col:'#bfe4ff', sci:'갑작스러운 서리는 식물을 얼려 죽여요.', apply(){const d=Math.ceil(S.pop[0]*.3);S.pop[0]-=d;addMod('temp',-1);return `풀 ${d}이(가) 얼어 죽었다! 온도 −1`}},
  fire:{name:'행성 소각', col:'#ff4a1a', sci:'산불은 생산자를 없애 먹이 사슬 전체를 흔들어요.', apply(){const a=Math.ceil(S.pop[0]*.5),b=Math.ceil(S.pop[1]*.3);S.pop[0]-=a;S.pop[1]-=b;return `풀 ${a}, 메뚜기 ${b}마리가 불탔다!`}},
};
const BOSSES = [
  {name:'그레이 정찰병', hp:55, atk:[4,5], attack:'광선총', abil:['shade','drain'], skin:{body:'#9fb4c4',dark:'#6f8597',eye:'#141821',glow:'#7fe0ff'}, extra:'',
   taunt:'삐빅… 지구 생태계 발견. 빛과 물을 빼앗아 약하게 만들겠다!',
   lesson:'생물 피라미드: 아래 단계(먹이)의 개체 수가 위 단계(포식자)보다 많아야 생태계가 유지돼요.'},
  {name:'냉동 함장 크릭', hp:70, atk:[5,6], attack:'얼음 미사일', abil:['freeze','frost','shade'], skin:{body:'#8fd0e8',dark:'#4f97b5',eye:'#0e2333',glow:'#bfe9ff'}, extra:'visor',
   taunt:'정찰병을 이겼다고? 내 절대 영도로 변온동물들을 꽁꽁 얼려 주마!',
   lesson:'온도는 비생물 요소예요. 변온동물은 주변 온도에 따라 체온이 변해서 추우면 활동과 번식이 줄어요.'},
  {name:'개조 여왕 조르그', hp:100, atk:[6,7], attack:'파괴 광선', abil:['heat','acid','fire','drain'], skin:{body:'#b58ae0',dark:'#7a4fb0',eye:'#1d0c2a',glow:'#ff8bd8'}, extra:'crown',
   taunt:'하찮은 지구 생물들… 이 행성을 불태워 우리 행성으로 개조하겠다!',
   lesson:'생태계 평형: 한 단계가 크게 줄어도 먹이 사슬을 따라 다시 회복해요. 생산자가 튼튼할수록 회복이 빨라요.'},
];
const MAXHP = 50, HANDMAX = 8, DRAWS = 2, FIRST_DRAWS = 4;

// ================= 그림 =================
const MEADOW = `<svg class="bgsvg" viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4e8"/><stop offset="1" stop-color="#d9f0f5"/></linearGradient>
  <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fca62"/><stop offset="1" stop-color="#5f9c3f"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#gSky)"/>
  <ellipse cx="160" cy="70" rx="70" ry="18" fill="#fff" opacity=".7"/><ellipse cx="200" cy="58" rx="40" ry="16" fill="#fff" opacity=".7"/>
  <ellipse cx="560" cy="48" rx="55" ry="14" fill="#fff" opacity=".6"/>
  <path d="M0 280 Q120 200 240 255 T480 240 T800 250 V500 H0Z" fill="#a9d6a0"/>
  <path d="M0 300 Q200 250 400 290 T800 285 V500 H0Z" fill="#9ccc80"/>
  <rect y="300" width="800" height="200" fill="url(#gGround)"/>
  <g fill="#4f8a33" opacity=".5"><path d="M60 360 l4 -14 l4 14z"/><path d="M300 330 l4 -12 l4 12z"/><path d="M700 380 l4 -14 l4 14z"/><path d="M520 420 l4 -14 l4 14z"/><path d="M150 450 l4 -14 l4 14z"/><path d="M420 470 l4 -12 l4 12z"/></g>
</svg>`;
const UFO = `<svg viewBox="0 0 200 110" style="width:100%;overflow:visible" aria-hidden="true">
  <ellipse cx="100" cy="46" rx="42" ry="34" fill="#bfefff" opacity=".85" stroke="#fff" stroke-width="2"/>
  <ellipse cx="100" cy="72" rx="98" ry="26" fill="#6e7a8c"/><ellipse cx="100" cy="64" rx="98" ry="20" fill="#c3cbd6"/>
  <g fill="#ffe36b"><circle cx="30" cy="74" r="6"/><circle cx="70" cy="82" r="6"/><circle cx="130" cy="82" r="6"/><circle cx="170" cy="74" r="6"/></g>
</svg>`;
function alienSVG(s,extra){
  const crown = extra==='crown' ? `<path d="M52 26 L60 6 L70 22 L80 2 L90 22 L100 6 L108 26 Z" fill="#f2c94c" stroke="#a87b10" stroke-width="2"/>` : '';
  const visor = extra==='visor' ? `<rect x="34" y="52" width="92" height="30" rx="14" fill="#cfefff" opacity=".35" stroke="#fff" stroke-width="2"/>` : '';
  const ant = extra==='crown' ? '' : `<path d="M62 30 Q52 12 40 8" stroke="${s.dark}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="8" r="6" fill="${s.glow}"/>
    <path d="M98 30 Q108 12 120 8" stroke="${s.dark}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="120" cy="8" r="6" fill="${s.glow}"/>`;
  return `<svg viewBox="0 0 160 175" aria-hidden="true">
    <ellipse cx="80" cy="166" rx="50" ry="8" fill="rgba(0,0,0,.22)"/>
    ${ant}
    <path d="M50 108 Q34 122 26 140" stroke="${s.dark}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M110 108 Q126 122 134 140" stroke="${s.dark}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="128" y="132" width="20" height="9" rx="3" fill="#444" transform="rotate(-20 138 136)"/>
    <path d="M56 100 Q80 92 104 100 L112 152 Q80 162 48 152 Z" fill="${s.dark}"/>
    <path d="M62 104 Q80 98 98 104 L102 140 Q80 146 58 140 Z" fill="${s.body}" opacity=".55"/>
    <circle cx="80" cy="120" r="6" fill="${s.glow}"/>
    <ellipse cx="80" cy="62" rx="50" ry="44" fill="${s.body}"/>
    <ellipse cx="66" cy="38" rx="18" ry="8" fill="#fff" opacity=".25"/>
    <ellipse cx="60" cy="68" rx="14" ry="20" fill="${s.eye}" transform="rotate(-22 60 68)"/>
    <ellipse cx="100" cy="68" rx="14" ry="20" fill="${s.eye}" transform="rotate(22 100 68)"/>
    <circle cx="55" cy="61" r="4.5" fill="#fff"/><circle cx="95" cy="61" r="4.5" fill="#fff"/>
    <path d="M72 92 Q80 96 88 92" stroke="${s.eye}" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${visor}${crown}
  </svg>`;
}
const art = {
  meadow:()=>`<div class="sc-center" style="top:52%">${[[4,2,40],[3,3,34],[2,4,30],[1,6,26],[0,9,24]].map(([k,n,fs])=>`<div class="sc-row" style="font-size:${fs}px">${LV[k].icon.repeat(n)}</div>`).join('')}</div>`,
  ufoDown:()=>`<div class="beam2"></div><div class="ufo down">${UFO}</div>`,
  ufoUp:()=>`<div class="ufo up">${UFO}</div>`,
  alien:(i,orbit)=>`<div class="bigalien">${alienSVG(BOSSES[i].skin,BOSSES[i].extra)}</div>`+(orbit?`<div class="orbit">${['☀️','💧','🌡️','🪱'].map((e,j)=>{const a=j*Math.PI/2;return `<span style="left:${Math.cos(a)*230}px;top:${Math.sin(a)*150}px">${e}</span>`}).join('')}</div>`:''),
  hero:()=>`<div class="sc-center"><div class="hero">🧑‍🔬</div><div class="sc-row" style="font-size:40px">🌿🦗🐸🐍🦅</div></div>`,
  pyramid:()=>`<div class="sc-center" style="top:40%"><div class="pyr2">${[4,3,2,1,0].map((k,i)=>`<div style="width:${110+i*90}px;background:var(--lv${k});animation-delay:${i*120}ms">${LV[k].icon} ${LV[k].name}</div>`).join('')}</div></div>`,
};
const OPENING = [
  {title:true},
  {art:art.meadow(), text:'여기는 푸른 초원. 풀, 메뚜기, 개구리, 뱀, 매가 서로 먹고 먹히며 균형을 이루고 살고 있었어요.'},
  {art:art.ufoDown(), dark:true, text:'그런데 어느 날, 하늘이 번쩍이더니 거대한 UFO가 내려왔어요!'},
  {art:art.alien(0,true), dark:true, text:'외계인들은 빛·물·온도·토양 같은 비생물 요소를 조종해서 지구를 자기들 행성처럼 바꾸려고 해요.'},
  {art:art.hero(), text:'당신은 이 초원을 지키는 생태계 수호자! 먹이 사슬의 힘으로 외계인을 물리쳐야 해요.'},
  {art:art.pyramid(), text:'하지만 기억하세요. 포식자만 늘리면 먹이가 사라져 생태계가 무너져요. 아래 단계가 더 많은 생물 피라미드를 지켜야 해요!'},
];

const tauntScene = i => [{art:art.alien(i), dark:true, speaker:BOSSES[i].name, text:BOSSES[i].taunt}];

// ================= 상태 =================
let S;
function newStage(stage, hp){
  S = {v:4, stage, turn:1, hp, maxhp:MAXHP, shield:0, bossHp:BOSSES[stage].hp, bossMax:BOSSES[stage].hp,
    pop:[14,3,0,0,0], fac:{light:0,water:0,soil:0,temp:0}, draws:FIRST_DRAWS, bioUsed:false, draw:shuffle(DECK.slice()), discard:[], hand:[],
    intent:null, busy:false, over:false, crashes:0, justDrew:-1, popIn:null};
  S.intent = pickIntent();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}

// ================= 생태계 규칙 =================
function fv(f){return S.fac[f]}
function addMod(factor,amt){S.fac[factor]=Math.max(-3,Math.min(3,S.fac[factor]+amt))}
function growthParts(G){
  const L=fv('light'),W=fv('water'),So=fv('soil'),T=fv('temp');
  const parts=[['기본',3],['풀 번식',Math.floor(G*0.2)],['빛',2*L],['물',2*W],['토양',So]];
  if(T<=-1) parts.push(['추위',-3]);
  if(T>=2) parts.push(['폭염',-3]);
  return {parts,total:Math.max(0,parts.reduce((s,p)=>s+p[1],0))};
}
function pyramidOK(p){if(p[1]<=0) return false;for(let k=0;k<4;k++) if(p[k]<p[k+1]) return false;return true}
function simulate(){
  const p=S.pop, T=fv('temp'), cold=T<=-1, warm=T>=1;
  const fed=[0,0,0,0,0], starve=[0,0,0,0,0], eaten=[0,0,0,0,0], repro=[0,0,0,0,0], atk=[0,0,0,0,0];
  let dmg=0;
  for(let k=1;k<5;k++){
    let a=Math.floor(p[k]*LV[k].atk); if(cold&&LV[k].ecto) a=Math.floor(a/2); atk[k]=a; dmg+=a;
    fed[k]=Math.min(p[k],p[k-1]); starve[k]=p[k]-fed[k];
  }
  for(let k=0;k<4;k++) eaten[k]=fed[k+1];
  for(let k=1;k<5;k++){
    let r=Math.round(fed[k]*LV[k].r);
    if(LV[k].ecto){ if(cold) r=0; else if(warm&&fed[k]>0) r+=1; }
    repro[k]=r;
  }
  const g=growthParts(p[0]).total;
  const next=[0,0,0,0,0];
  next[0]=Math.min(LV[0].cap,Math.max(0,p[0]-eaten[0])+g);
  for(let k=1;k<5;k++) next[k]=Math.min(LV[k].cap,Math.max(0,p[k]-eaten[k]-starve[k]+repro[k]));
  return {fed,starve,eaten,repro,atk,dmg,growth:g,next,cold};
}
function pickIntent(){
  const b=BOSSES[S.stage];
  const ab = S.turn%2===0 ? b.abil[rint(0,b.abil.length-1)] : null;
  return {ab, dmg:rint(b.atk[0],b.atk[1])+Math.floor((S.turn-1)/4)};
}

// ================= 카드 =================
function canPlay(id){
  const c=CARDS[id];
  if(S.busy||S.over) return '';
  if(c.type==='bio'){
    if(S.bioUsed) return '생물 카드는 턴당 1장';
    if(S.pop[c.lv]>=LV[c.lv].cap) return '더 살 공간이 없어요';
    if(c.lv>0&&S.pop[c.lv-1]<c.n) return `먹을 ${LV[c.lv-1].name}가 ${c.n} 필요 (지금 ${S.pop[c.lv-1]})`;
  }
  return null;
}
function drawCard(){
  if(S.busy||S.over||S.draws<=0||S.hand.length>=HANDMAX) return;
  if(!S.draw.length){S.draw=shuffle(S.discard);S.discard=[]}
  if(!S.draw.length) return;
  const id=S.draw.pop(); S.hand.push(id); S.draws--; S.justDrew=S.hand.length-1;
  setMsg(`${CARDS[id].icon} ${CARDS[id].name} 카드를 뽑았다!`, S.draws>0?`남은 뽑기 ${S.draws}번 · 덱을 한 번 더 누르세요.`:'카드를 내고 턴 종료를 누르세요. 생물 카드는 1장, 비생물 카드는 몇 장이든 낼 수 있어요.');
  render();
  const h=$('hand'); h.scrollLeft=h.scrollWidth;
}
function play(i){
  const id=S.hand[i], c=CARDS[id];
  if(canPlay(id)!==null) return;
  S.discard.push(id); S.hand.splice(i,1); S.justDrew=-1;
  if(c.type==='bio'){
    S.bioUsed=true;
    const before=S.pop[c.lv];
    if(c.lv>0){S.pop[c.lv-1]-=c.n;}
    S.pop[c.lv]=Math.min(LV[c.lv].cap,S.pop[c.lv]+c.n);
    S.popIn={lv:c.lv,from:before};
    render(); S.popIn=null;
    flashStat([c.lv,c.lv-1]);
    floatAtRow(c.lv,`+${c.n}`,'good');
    if(c.lv>0){ floatAtRow(c.lv-1,`−${c.n}`,'dmg'); setMsg(`가랏! ${c.icon} ${LV[c.lv].name} ${c.n}마리 등장! ${LV[c.lv-1].name} ${c.n}${c.lv===1?'':'마리'}를 먹어 치웠다!`, c.sci); }
    else setMsg(`${c.icon} 풀 씨앗을 뿌렸다! 풀 +${c.n}`, c.sci);
  }else{
    addMod(c.factor,c.amt);
    if(id==='rain'){S.pop[0]=Math.min(LV[0].cap,S.pop[0]+3);}
    render(); flashStat([0]);
    floatAtRow(0,`${FAC[c.factor].icon} ${c.amt>0?'+':''}${c.amt}`,'info');
    setMsg(`${c.icon} ${c.name}! ${c.eff}`, c.sci);
  }
}

// ================= 화면 맞추기 =================
const $=id=>document.getElementById(id);
let SCALE=1;
function fit(){
  const app=$('app'), vw=window.innerWidth, vh=window.innerHeight;
  const portrait = vw/vh < 1.15;
  app.classList.toggle('portrait',portrait);
  const W=portrait?700:1200, H=portrait?1000:760;
  SCALE=Math.min(vw/W,vh/H);
  app.style.transform=`translate(${Math.max(0,(vw-W*SCALE)/2)}px,${Math.max(0,(vh-H*SCALE)/2)}px) scale(${SCALE})`;
}
window.addEventListener('resize',fit);

// ================= 연출 =================
let skipFn=null;
function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function setMsg(html,sub){$('msg').innerHTML=html+(sub?`<small>${sub}</small>`:'');$('arrow').hidden=true}
function say(html,sub,ms=1300){
  setMsg(html,sub); $('arrow').hidden=false;
  if(reduced()) ms=Math.min(ms,700);
  return new Promise(res=>{const t=setTimeout(done,ms);function done(){clearTimeout(t);skipFn=null;res()}skipFn=done});
}
$('textbox').addEventListener('click',()=>skipFn&&skipFn());
function wait(ms){return new Promise(r=>setTimeout(r,reduced()?0:ms))}
function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function rel(el){const f=$('field').getBoundingClientRect(),r=el.getBoundingClientRect();return {x:(r.left-f.left+r.width/2)/SCALE,y:(r.top-f.top+r.height/2)/SCALE,w:r.width/SCALE,h:r.height/SCALE}}
function floatAt(x,y,text,cls){const d=document.createElement('div');d.className='floater '+cls;d.textContent=text;d.style.left=x+'px';d.style.top=y+'px';$('field').appendChild(d);setTimeout(()=>d.remove(),1200)}
function floatAtRow(k,text,cls){const r=document.querySelector(`.erow[data-lv="${k}"]`);if(!r)return;const p=rel(r);floatAt(p.x+p.w/2+16,p.y,text,cls)}
function boomAt(x,y,ch='💥'){const d=document.createElement('div');d.className='boom';d.textContent=ch;d.style.left=x+'px';d.style.top=y+'px';$('field').appendChild(d);setTimeout(()=>d.remove(),550)}
function shakeField(){anim($('field'),'shake')}
function banner(text,col){const b=$('banner');b.textContent=text;anim(b,'on');const t=$('tint');t.style.background=col;anim(t,'on')}
async function fly(fromEl,emoji,n){
  const a=rel(fromEl), b=rel($('alien').querySelector('svg'));
  const jobs=[];
  for(let i=0;i<Math.min(n,4);i++){
    const s=document.createElement('div');s.className='proj';s.textContent=emoji;
    s.style.left=(a.x-13+(i-1.5)*14)+'px';s.style.top=(a.y-13)+'px';$('field').appendChild(s);
    const dx=b.x-a.x-(i-1.5)*14, dy=b.y-a.y;
    if(reduced()){s.remove();continue}
    jobs.push(s.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-70}px) scale(1.5) rotate(-20deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.9)`}],
      {duration:480,delay:i*70,easing:'ease-in',fill:'forwards'}).finished.then(()=>s.remove()));
  }
  await Promise.all(jobs);
  boomAt(b.x,b.y);
}
async function laser(col){
  const a=rel($('alien').querySelector('svg')), b=rel($('eco'));
  const ax=a.x-a.w*0.12, ay=a.y-a.h*0.08, bx=b.x, by=b.y+b.h*0.15;
  const len=Math.hypot(bx-ax,by-ay), ang=Math.atan2(by-ay,bx-ax)*180/Math.PI;
  const l=document.createElement('div');l.className='laser';l.style.left=ax+'px';l.style.top=ay+'px';l.style.width=len+'px';
  l.style.background=`linear-gradient(90deg,#fff,${col})`;l.style.setProperty('--glow',col);l.style.transform=`rotate(${ang}deg) scaleX(0)`;
  $('field').appendChild(l);
  if(!reduced()) await l.animate([{transform:`rotate(${ang}deg) scaleX(0)`},{transform:`rotate(${ang}deg) scaleX(1)`}],{duration:260,easing:'ease-out',fill:'forwards'}).finished;
  boomAt(bx,by); anim($('eco'),'hit'); shakeField();
  setTimeout(()=>l.remove(),180);
}
function flashStat(ks){requestAnimationFrame(()=>ks.forEach(k=>{const r=document.querySelector(`#stat tr[data-lv="${k}"]`);if(r){r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),700)}}))}
(function(){
  $('fieldBg').outerHTML=MEADOW;
  for(const [id,ch,n] of [['wSnow','❄',16],['wRain','',26]]){
    let h='';for(let i=0;i<n;i++) h+=`<span style="left:${Math.random()*100}%;animation-duration:${(2.5+Math.random()*2).toFixed(2)}s;animation-delay:-${(Math.random()*4).toFixed(2)}s">${ch}</span>`;
    $(id).innerHTML=h;
  }
})();

// ================= 스토리 =================
let storyNext=null;
function story(scenes){
  return new Promise(resolve=>{
    const box=$('story'); box.hidden=false;
    let i=0, typing=null, full='';
    function finish(){box.hidden=true;storyNext=null;resolve()}
    function show(){
      const sc=scenes[i];
      $('sdots').innerHTML=scenes.length>1?scenes.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join(''):'';
      box.classList.toggle('dark',!!sc.dark);
      if(sc.title){
        $('scene').innerHTML=MEADOW+art.meadow().replace('top:52%','top:87%')+`<div class="title"><h2>생피 카드게임</h2><p>먹이 사슬로 외계인을 물리쳐라!</p><button class="startbtn" type="button">게임 시작</button></div>`;
        $('stextBox').hidden=true; $('skip').hidden=true; return;
      }
      $('stextBox').hidden=false; $('skip').hidden=false;
      $('scene').innerHTML=MEADOW+sc.art;
      $('speaker').hidden=!sc.speaker; $('speaker').textContent=sc.speaker||'';
      full=sc.text; let n=0; $('stext').textContent=''; $('sarrow').hidden=true;
      clearInterval(typing);
      if(reduced()){ $('stext').textContent=full; $('sarrow').hidden=false; typing=null; return; }
      typing=setInterval(()=>{n+=1;$('stext').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;$('sarrow').hidden=false}},32);
    }
    storyNext=()=>{
      if(typing){clearInterval(typing);typing=null;$('stext').textContent=full;$('sarrow').hidden=false;return}
      i++; if(i>=scenes.length) finish(); else show();
    };
    $('skip').onclick=e=>{e.stopPropagation();clearInterval(typing);finish()};
    show();
  });
}
$('story').addEventListener('click',()=>storyNext&&storyNext());
document.addEventListener('keydown',e=>{if(!$('story').hidden&&(e.key==='Enter'||e.key===' ')){e.preventDefault();storyNext&&storyNext()}});

// ================= 턴 진행 =================
async function endTurn(){
  if(S.busy||S.over) return;
  S.busy=true; render();
  const b=BOSSES[S.stage], before=S.pop.slice(), sim=simulate();

  // 1. 나의 공격
  if(sim.dmg>0){
    for(let k=4;k>=1;k--){
      if(!sim.atk[k]) continue;
      const row=document.querySelector(`.erow[data-lv="${k}"]`);
      setMsg(`${LV[k].icon} ${LV[k].name} ${before[k]}마리의 공격!`);
      if(row) await fly(row,LV[k].icon,before[k]);
      S.bossHp=Math.max(0,S.bossHp-sim.atk[k]); anim($('alien'),'hit');
      const ap=rel($('alien').querySelector('svg')); floatAt(ap.x,ap.y-30,`−${sim.atk[k]}`,'dmg'); render();
      await say(`${LV[k].icon} ${LV[k].name} ${before[k]}마리의 공격! ${b.name}에게 ${sim.atk[k]} 피해!`, sim.cold&&LV[k].ecto?'추위 때문에 변온동물의 힘이 절반이 됐어요.':'', 900);
      if(S.bossHp<=0) break;
    }
  }else{
    await say('공격할 소비자가 없다…','메뚜기·개구리·뱀·매가 있어야 외계인을 공격할 수 있어요.',1300);
  }
  if(S.bossHp<=0){anim($('alien'),'faint');await say(`${b.name}이(가) 쓰러졌다!`,'',1500);S.busy=false;return stageClear()}

  // 2. 먹이 사슬
  S.pop=sim.next.slice(); render(); flashStat([0,1,2,3,4]);
  const eat=[];for(let k=4;k>=1;k--) if(sim.fed[k]) eat.push(`${LV[k].icon}가 ${LV[k-1].icon} ${sim.fed[k]}`);
  if(eat.length) await say('먹이 사슬이 움직인다!', '먹은 양: '+eat.join(' · ')+' — 먹힌 만큼 아래 단계가 줄어요.',1300);
  for(let k=1;k<5;k++) if(sim.starve[k]>0){
    S.crashes++;
    await say(`${LV[k].icon} ${LV[k].name} ${sim.starve[k]}마리가 먹이를 못 찾아 굶어 죽었다…`,`${LV[k-1].name}보다 ${LV[k].name}가 많았어요. 포식자가 너무 많으면 먹이가 줄고, 결국 포식자도 줄어요.`,1800);
  }
  const born=[];for(let k=1;k<5;k++) if(sim.repro[k]) born.push(`${LV[k].icon}+${sim.repro[k]}`);
  await say(`🌿 풀이 ${sim.growth} 자랐다!`+(born.length?` 새끼가 태어났다! ${born.join(' ')}`:''), sim.cold?'추워서 변온동물은 번식하지 못했어요.':'배부른 동물만 번식해요. 풀은 빛·물·토양이 좋을수록 많이 자라요.',1300);

  // 3. 평형
  S.shield = pyramidOK(S.pop) ? 4 : 0; render();
  if(S.shield) await say('생물 피라미드 완성! 방어막 +4','아래 단계가 위 단계보다 많아서 생태계가 안정됐어요.',1000);


  // 5. 외계인의 차례
  const it=S.intent, al=$('alien');
  if(it.ab){
    const ab=ABIL[it.ab];
    al.style.setProperty('--glow',ab.col); anim(al,'charge');
    banner(ab.name+'!',ab.col);
    await say(`${b.name}의 특수 능력 「${ab.name}」!`,'외계인이 비생물 요소를 조종해요.',1100);
    const extra=ab.apply(); S.pop=S.pop.map(x=>Math.max(0,x)); render();
    await say(extra||ab.say, ab.sci,1600);
  }
  al.style.setProperty('--glow',b.skin.glow); anim(al,'charge');
  setMsg(`${b.name}의 ${b.attack}!`);
  await wait(300); await laser(b.skin.glow);
  const blocked=Math.min(S.shield,it.dmg), real=it.dmg-blocked;
  S.hp=Math.max(0,S.hp-real); S.shield=0;
  const ep=rel($('eco')); floatAt(ep.x,ep.y-20,real?`−${real}`:'막았다!',real?'dmg':'info'); render();
  await say(`${b.name}의 ${b.attack}! 나의 생태계에 ${real} 피해!`, blocked?`방어막이 ${blocked}만큼 막아 줬어요.`:'생물 피라미드 모양으로 턴을 끝내면 방어막이 생겨요.',1300);
  if(S.hp<=0){anim($('eco'),'faint');await say('나의 생태계가 무너졌다…','',1500);S.busy=false;render();return gameOver(false)}

  // 6. 다음 턴
  S.turn++; S.draws=DRAWS; S.bioUsed=false; S.intent=pickIntent(); S.justDrew=-1; S.busy=false; render();
  setMsg(`${S.turn}턴! 덱을 눌러 카드를 ${DRAWS}장 뽑으세요.`, '생물 카드는 1장, 비생물 카드는 몇 장이든 낼 수 있어요.');
}

async function intro(){
  const b=BOSSES[S.stage];
  S.busy=true; render(); anim($('alien'),'enter');
  await say(`앗! 외계인 ${b.name}이(가) 나타났다!`, `직접 공격: ${b.attack} · 특수 능력: ${b.abil.map(a=>ABIL[a].name).join(', ')}`,1700);
  S.busy=false; render();
  setMsg(`덱을 눌러 카드를 ${S.draws}장 뽑으세요!`, '생물 카드는 1장, 비생물 카드는 몇 장이든 낼 수 있어요.');
}
async function beginStage(stage){
  newStage(stage,MAXHP); render();
  await story(tauntScene(stage));
  intro();
}
async function stageClear(){
  S.over=true; render();
  const b=BOSSES[S.stage], last=S.stage===BOSSES.length-1;
  if(last){
    await story(ENDING);
    dialog(`<h2>🏆 외계인을 모두 물리쳤어요!</h2>
      <p>이번 게임에서 배운 것을 정리해 볼까요?</p>
      <div class="lesson">${BOSSES.map(x=>'• '+x.lesson).join('<br>')}</div>
      <p>포식자를 무작정 늘리는 대신 먹이 사슬의 균형을 맞춘 것이 승리의 열쇠였어요.</p>
      <div class="acts"><button class="endbtn go" type="button" data-act="restart">처음부터 다시</button></div>`);
  }else{
    dialog(`<h2>${b.name} 격파!</h2>
      <p>${S.turn}턴 만에 이겼어요.</p>
      <div class="lesson"><b>오늘의 개념</b><br>${b.lesson}</div>
      <p>생태계는 처음 상태로 돌아가고 HP는 모두 회복돼요.</p>
      <div class="acts"><button class="endbtn go" type="button" data-act="next">다음 스테이지</button></div>`);
  }
}
function gameOver(forfeit){
  S.over=true; render();
  const tip=S.crashes>0
    ?'포식자를 먹이보다 많이 늘려서 굶어 죽은 적이 있어요. 생물 카드를 내면 바로 아래 단계가 줄어든다는 것도 기억하세요.'
    :'외계인이 비생물 요소를 망가뜨리면 비생물 카드로 되돌려 보세요. 피라미드 모양을 유지하면 방어막도 얻어요.';
  dialog(`<h2>${forfeit?'기권했어요':'생태계가 무너졌어요'}</h2>
    <p>스테이지 ${S.stage+1}, ${S.turn}턴에서 게임이 끝났어요.</p>
    <div class="lesson"><b>다음엔 이렇게</b><br>${tip}</div>
    <div class="acts"><button class="ghost" type="button" data-act="restart">스테이지 1부터</button>
      <button class="endbtn go" type="button" data-act="retry">이 스테이지 다시</button></div>`);
}

// ================= 렌더 =================
let lastBoss=-1;
function hpClass(r){return r>.5?'':r>.2?'mid':'low'}
function render(){
  const b=BOSSES[S.stage], sim=simulate();
  $('stagePill').textContent=`스테이지 ${S.stage+1} / ${BOSSES.length} · ${S.turn}턴`;
  if(lastBoss!==S.stage){$('alien').innerHTML=alienSVG(b.skin,b.extra);lastBoss=S.stage}
  if(!S.over){$('alien').classList.remove('faint'); $('eco').classList.remove('faint');}
  $('eName').textContent=b.name;
  const er=S.bossHp/S.bossMax, pr=S.hp/S.maxhp;
  $('eHp').style.width=er*100+'%'; $('eHp').className=hpClass(er); $('eHpN').textContent=`${S.bossHp} / ${S.bossMax}`;
  $('pHp').style.width=pr*100+'%'; $('pHp').className=hpClass(pr); $('pHpN').textContent=`${S.hp} / ${S.maxhp}`;
  $('pShield').textContent=S.shield?`🛡 ${S.shield}`:'';

  // 전장의 생태계 (살아 있는 피라미드)
  let eh='';
  for(let k=4;k>=0;k--){
    const n=S.pop[k]; if(n<=0) continue;
    const cnt=Math.min(LV[k].show,Math.ceil(n/LV[k].per));
    const newFrom = S.popIn&&S.popIn.lv===k ? Math.min(cnt,Math.ceil(S.popIn.from/LV[k].per)) : cnt;
    let icons='';
    for(let i=0;i<cnt;i++) icons+=`<span class="ic ${i>=newFrom?'pop':(k===4||k===1)?'bob':''}" style="animation-delay:${i>=newFrom?(i-newFrom)*70:i*130}ms">${LV[k].icon}</span>`;
    eh+=`<div class="erow" data-lv="${k}">${icons}<span class="badge num">${n}</span></div>`;
  }
  $('eco').innerHTML=eh||'<div class="erow" data-lv="0" style="opacity:.5">🍂</div>';

  // 날씨
  const L=fv('light'),W=fv('water'),So=fv('soil'),T=fv('temp');
  $('wDark').style.opacity=L<0?Math.min(.5,-L*.2):0;
  $('wBright').style.opacity=L>0?Math.min(1,L*.5):0;
  $('wDry').style.opacity=W<0?Math.min(1,-W*.4):0;
  $('wRain').style.opacity=W>0?1:0;
  $('wCold').style.opacity=T<0?Math.min(1,-T*.4):0;
  $('wSnow').style.opacity=T<0?1:0;
  $('wHot').style.opacity=T>=2?Math.min(1,T*.3):0;
  $('wAcid').style.opacity=So<0?Math.min(1,-So*.45):0;
  $('wRich').style.opacity=So>0?Math.min(1,So*.5):0;

  // 생태계 현황 표
  let st='';
  for(let k=4;k>=0;k--){
    const n=S.pop[k], nx=sim.next[k], d=nx-n;
    let food='';
    if(k===0) food=`<span class="ok">생장 +${sim.growth}</span>`;
    else{const prey=S.pop[k-1], opt=Math.floor(prey/2);
      food = n>prey?`<span class="bad">먹이 부족 ${n-prey}</span>` : n>opt?`<span class="warn">적정 ≤${opt} (많음)</span>`:`<span class="ok">적정 ≤${opt}</span>`;}
    st+=`<tr data-lv="${k}"><td>${LV[k].icon} ${LV[k].name} <span class="atk">${k?'⚔'+LV[k].atk:''}</span></td><td class="n"><span class="cnt">${n}</span> <span class="nx ${d>0?'up':d<0?'down':''}">→${nx}</span></td><td class="n">${food}</td></tr>`;
  }
  $('stat').innerHTML=st; $('dmgPrev').textContent=sim.dmg;
  const ok=pyramidOK(S.pop);
  $('balChip').className='chip '+(ok?'ok':'bad'); $('balChip').textContent=ok?'피라미드 ✓ 방어막':'피라미드 ✗';

  // 비생물 요소
  let fh='';
  for(const f of ['light','water','soil','temp']){
    const v=fv(f);
    const optOK = f==='temp' ? (i=>i===0||i===1) : (i=>i>=0);
    const cells=[-3,-2,-1,0,1,2,3].map(i=>{let c='';if(i===0)c='mid';else if(v>0&&i>0&&i<=v)c=(f==='temp'&&i>=2)?'neg':'pos';else if(v<0&&i<0&&i>=v)c='neg';return `<i class="${c} ${optOK(i)?'opt':''}"></i>`}).join('');
    let eff='', cls='';
    if(f==='temp'){ if(v<=-1){eff='추움 풀−3';cls='bad'} else if(v>=2){eff='폭염 풀−3';cls='bad'} else {eff=v===1?'적정·번식+1':'적정';cls='good'} }
    else { const per=f==='soil'?1:2, d=v*per; eff=`풀 ${d>=0?'+':''}${d}/턴`; cls=d<0?'bad':d>0?'good':''; }
    fh+=`<div class="fac"><span>${FAC[f].icon} ${FAC[f].name}</span><div class="gauge" aria-hidden="true">${cells}</div><b class="num">${v>0?'+':''}${v}</b><span class="eff ${cls}">${eff}</span></div>`;
  }
  $('facs').innerHTML=fh;
  $('growChip').textContent=`풀 생장 +${sim.growth}`;
  const notes=[]; if(T<=-1) notes.push('🥶 추위: 변온동물 번식 ✗, 힘 절반'); if(T>=2) notes.push('🥵 폭염: 풀 생장 −3'); if(T===1) notes.push('🌤 따뜻함: 변온동물 번식 +1');
  $('facNote').innerHTML='빛·물 1당 풀 +2, 토양 1당 풀 +1 · <b>적정</b>: 빛·물·토양 0 이상, 온도 0~+1 (노란 테두리) · 한 번 바뀐 값은 계속 유지돼요';


  // 덱 · 손패
  const canDraw=!S.busy&&!S.over&&S.draws>0&&S.hand.length<HANDMAX&&(S.draw.length+S.discard.length>0);
  $('deck').disabled=!canDraw;
  $('deckLabel').innerHTML=`<span class="num">덱 ${S.draw.length}</span>`+(S.draws>0?` <span class="draws">뽑기 ${S.draws}</span>`:'')+(S.hand.length>=HANDMAX&&S.draws>0?'<small>손패 가득</small>':'');
  $('hand').innerHTML=S.hand.map((id,i)=>{
    const c=CARDS[id], why=canPlay(id), col=c.type==='bio'?`var(--lv${c.lv})`:'var(--sky)';
    return `<button class="card ${i===S.justDrew?'drawn':''}" type="button" data-i="${i}" style="--cc:${col}" ${why!==null?'disabled':''} title="${c.sci}" aria-label="${c.name}">
      <div class="ct"><span>${c.type==='bio'?'생물':'비생물'}</span><span>${c.type==='bio'?'턴당 1장':'무제한'}</span></div>
      <div class="art" aria-hidden="true">${c.icon}</div><div class="cn">${c.name}</div><div class="ce">${c.eff}</div><div class="cx">${INFO[id]}</div>
      ${why?`<div class="why">${why}</div>`:''}</button>`}).join('') || `<p class="empty">← 덱을 눌러 카드를 뽑으세요</p>`;
  $('ruleBox').innerHTML=`생물 <b>${S.bioUsed?1:0}/1</b> · 비생물 <b>∞</b>`;
  $('btnEnd').disabled=S.busy||S.over;
  $('btnEnd').classList.toggle('go',S.draws===0);
}

// ================= 대화상자 =================
function dialog(html){$('dlg').innerHTML=html;$('ov').hidden=false;const f=$('dlg').querySelector('button');f&&f.focus()}
function closeDialog(){$('ov').hidden=true}
const HELP=`
  <h2>게임 방법</h2>
  <div class="chain"><span>🌿 풀</span>→<span>🦗 메뚜기</span>→<span>🐸 개구리</span>→<span>🐍 뱀</span>→<span>🦅 매</span></div>
  <h3>내 차례</h3>
  <ul>
    <li><b>덱을 눌러 카드를 직접 뽑아요.</b> 첫 턴 4장, 그 뒤로 턴마다 2장.</li>
    <li><b>생물 카드는 턴당 1장.</b> 내는 순간 바로 아래 단계를 먹어요. 예: 개구리 +3을 내면 메뚜기가 바로 −3.</li>
    <li><b>비생물 카드</b>(햇빛·단비·토양·햇살·바람)는 몇 장이든 낼 수 있고, 바뀐 값은 턴이 지나도 계속 유지돼요(−3 ~ +3).</li>
    <li><b>턴 종료</b>: 소비자들이 외계인을 공격 → 먹고 먹히기 → 번식과 풀 생장.</li>
    <li><b>공격력(한 마리당)</b>: 메뚜기 0.5 · 개구리 1 · 뱀 3 · 매 5</li>
    <li><b>풀 생장(턴마다)</b>: 기본 3 + 풀 수의 20% + 빛×2 + 물×2 + 토양×1. 추위(온도 −1 이하)나 폭염(+2 이상)이면 −3.</li>
    <li><b>적정량</b>: 먹이가 포식자의 2배 이상일 때 안정적이에요. 비생물 요소는 빛·물·토양 0 이상, 온도 0~+1이 알맞아요.</li>
  </ul>
  <h3>외계인 차례</h3>
  <ul>
    <li>외계인은 매 턴 <b>직접 공격</b>해서 내 HP를 깎아요.</li>
    <li>가끔 <b>특수 능력</b>으로 비생물 요소(빛·물·온도·토양)를 망가뜨려 생태계를 약하게 만들어요.</li>
  </ul>
  <h3>과학 개념</h3>
  <ul>
    <li><b>생물 피라미드</b>: 위 단계로 갈수록 에너지가 줄어서 아래 단계의 개체 수가 더 많아야 해요. 피라미드 모양으로 턴을 끝내면 <b>방어막 4</b>.</li>
    <li><b>생태계 평형</b>: 포식자가 늘면 먹이가 줄고, 먹이가 줄면 포식자가 굶어 줄어요. 그러면 먹이가 다시 늘어요.</li>
    <li><b>비생물 요소</b>: 빛·물은 광합성에, 토양은 양분에 영향을 줘요. 추우면 변온동물(메뚜기·개구리·뱀)은 번식을 못 하고 힘이 절반이 돼요.</li>
  </ul>
  <h3>승리 · 패배</h3>
  <ul><li>외계인 3명을 모두 물리치면 승리. 내 HP가 0이 되거나 기권하면 패배.</li>
  <li>배틀 중 글상자를 누르면 다음 메시지로 빨리 넘어가요.</li></ul>`;

$('dlg').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]')?.dataset.act; if(!a) return;
  closeDialog();
  if(a==='begin') beginStage(0);
  if(a==='restart') beginStage(0);
  if(a==='retry'){newStage(S.stage,MAXHP);intro()}
  if(a==='next'){const n=S.stage+1;story(INTERLUDE[n]).then(()=>beginStage(n))}
  if(a==='forfeit') gameOver(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden&&$('dlg').querySelector('[data-act="close"]'))closeDialog()});
$('hand').addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&!c.disabled)play(+c.dataset.i)});
$('deck').addEventListener('click',drawCard);
$('btnEnd').addEventListener('click',endTurn);
$('btnHelp').addEventListener('click',()=>dialog(HELP+`<div class="acts"><button class="endbtn go" type="button" data-act="close">닫기</button></div>`));
$('btnForfeit').addEventListener('click',()=>{if(S.over||S.busy)return;dialog(`<h2>정말 기권할까요?</h2><p>기권하면 이번 게임은 패배로 끝나요.</p>
  <div class="acts"><button class="ghost" type="button" data-act="close">계속하기</button><button class="endbtn" type="button" data-act="forfeit">기권</button></div>`)});

// ================= 시작 =================
async function start(data){
  fit();
  newStage(0,MAXHP); render(); setMsg('');
  await story(OPENING);
  dialog(HELP+`<div class="acts"><button class="endbtn go" type="button" data-act="begin">출동!</button></div>`);
}
start();
</script>
