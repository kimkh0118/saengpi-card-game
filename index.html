<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>생피 · 초원의 기록</title>
<meta name="description" content="먹이 사슬과 생물 피라미드로 초원을 노리는 외계인을 막는 생태계 카드 게임">
<meta property="og:type" content="website">
<meta property="og:title" content="생피 · 초원의 기록">
<meta property="og:description" content="먹이 사슬과 생물 피라미드로 초원을 노리는 외계인을 막아라!">
<meta property="og:url" content="https://kimkh0118.github.io/saengpi-card-game/">
<meta property="og:image" content="https://kimkh0118.github.io/saengpi-card-game/thumbnail-4x3.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="900">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed-size game console screen (landscape 1200x760 or portrait 700x1000) scaled to fit the window, so everything is always on one screen. */
:root{
  --bg:#dfe7da; --surface:#f6f8f2; --surface2:#ebf0e6; --ink:#1b2a20; --muted:#5a6b5f; --line:#c3cfbd;
  --accent:#2f7d4f; --sun:#c98a12; --danger:#c0412c; --sky:#2f6f98; --shield:#3a6fb0;
  --tb:#fbfcf8; --tbline:#26342b;
  --lv0:#4f9a3a; --lv1:#93ad2c; --lv2:#2b958a; --lv3:#b9832a; --lv4:#8a4b3a;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(27,42,32,.06),0 6px 16px -8px rgba(27,42,32,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1510; --surface:#17211a; --surface2:#1e2a21; --ink:#e3ece1; --muted:#97aa99; --line:#2e3d32;
  --accent:#5fbf7f; --sun:#e6b04a; --danger:#ec7a62; --sky:#73b2da; --shield:#7aa6e6;
  --tb:#121a15; --tbline:#a9bfad;
  --lv0:#6cbf55; --lv1:#b5cc4a; --lv2:#45bdb0; --lv3:#dba64a; --lv4:#c07a63;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1510; --surface:#17211a; --surface2:#1e2a21; --ink:#e3ece1; --muted:#97aa99; --line:#2e3d32;
  --accent:#5fbf7f; --sun:#e6b04a; --danger:#ec7a62; --sky:#73b2da; --shield:#7aa6e6;
  --tb:#121a15; --tbline:#a9bfad;
  --lv0:#6cbf55; --lv1:#b5cc4a; --lv2:#45bdb0; --lv3:#dba64a; --lv4:#c07a63;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- fixed game canvas ---------- */
.app{position:fixed;left:0;top:0;transform-origin:0 0;padding:10px;display:grid;gap:8px;
  width:1200px;height:940px;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:32px auto auto minmax(0,1fr) 204px;
  grid-template-areas:"top top" "field stat" "field fac" "field guide" "hand hand"}
.app.portrait{width:700px;height:1060px;grid-template-columns:1fr 1fr;grid-template-rows:32px 430px auto auto minmax(0,1fr);
  grid-template-areas:"top top" "field field" "stat fac" "guide guide" "hand hand"}
.top{grid-area:top}.field{grid-area:field}#pStat{grid-area:stat}#pFac{grid-area:fac}#guide{grid-area:guide}.handzone{grid-area:hand}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait .brand small{display:none}
.toolbar{display:flex;gap:6px;align-items:center}
.pill{font-family:var(--display);font-size:14px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.ghost:hover{background:var(--surface)}
.ghost.warn{color:var(--danger)}

/* ---------- battle field ---------- */
.field{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:3px solid var(--tbline);background:#9fd2ea;isolation:isolate}
.field.shake{animation:fshake .45s}
@keyframes fshake{15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0;pointer-events:none;transition:opacity .7s;opacity:0}
.l-dark{background:#0a0f22}
.l-cold{background:linear-gradient(180deg,rgba(130,190,255,.55),rgba(220,240,255,.35))}
.l-hot{background:linear-gradient(180deg,rgba(255,110,30,.45),rgba(255,210,90,.25))}
.l-dry{background:linear-gradient(180deg,transparent 58%,rgba(176,124,62,.85) 60%)}
.l-acid{background:linear-gradient(180deg,transparent 58%,rgba(124,64,160,.55) 60%)}
.l-rich{background:linear-gradient(180deg,transparent 58%,rgba(70,45,20,.35) 60%)}
.l-bright{background:radial-gradient(circle at 10% 8%,rgba(255,236,140,.9),transparent 38%)}
.parts span{position:absolute;top:-8%;font-size:15px;color:#fff;animation:fall linear infinite}
.rain span{width:2px;height:18px;background:rgba(70,130,220,.75);font-size:0;animation-duration:.6s!important}
@keyframes fall{to{transform:translateY(700px)}}

.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#b9e08f 0%,#86bd5c 55%,rgba(60,100,40,0) 72%)}
.e-plat{right:5%;top:40%;width:34%;height:12%}
.p-plat{left:1%;bottom:20%;width:52%;height:16%}

.alien{position:absolute;right:11%;top:4%;height:42%;aspect-ratio:160/175;animation:hover 2.4s ease-in-out infinite;transform-origin:50% 100%}
.alien svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes hover{50%{transform:translateY(-6px)}}
.alien.hit svg{animation:hitflash .55s steps(2)}
@keyframes hitflash{0%,50%{opacity:.15;filter:brightness(3)}25%,75%,100%{opacity:1}}
.alien.faint{animation:faint .9s ease forwards}
@keyframes faint{to{transform:translateY(80px) scaleY(.4);opacity:0}}
.alien.enter{animation:enter .8s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateX(150%)}}
.alien.charge svg{animation:charge .6s ease}
@keyframes charge{40%{transform:scale(1.12) translateY(-6px);filter:drop-shadow(0 0 14px var(--glow))}}

.eco{position:absolute;left:3%;bottom:23%;width:48%;height:52%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.eco.hit{animation:hitflash .55s steps(2)}
.eco.faint{animation:faint .9s ease forwards}
.erow{display:flex;align-items:center;justify-content:center;gap:2px;line-height:1;position:relative}
.erow .ic{display:inline-block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.erow .ic.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(0)}}
.erow .ic.bob{animation:ebob 1.6s ease-in-out infinite}
@keyframes ebob{50%{transform:translateY(-3px)}}
.erow .badge{font-family:var(--display);font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.erow[data-lv="4"]{font-size:36px} .erow[data-lv="3"]{font-size:30px} .erow[data-lv="2"]{font-size:27px} .erow[data-lv="1"]{font-size:23px} .erow[data-lv="0"]{font-size:21px}

.app:not(.portrait) .erow[data-lv="4"]{font-size:46px} .app:not(.portrait) .erow[data-lv="3"]{font-size:40px} .app:not(.portrait) .erow[data-lv="2"]{font-size:35px} .app:not(.portrait) .erow[data-lv="1"]{font-size:30px} .app:not(.portrait) .erow[data-lv="0"]{font-size:27px}
.app:not(.portrait) .erow .badge{font-size:15px;padding:1px 8px}
.app:not(.portrait) .infobox b{font-size:21px}
.app:not(.portrait) .infobox{padding:7px 14px 8px}
.app:not(.portrait) .hp{height:11px}
.app:not(.portrait) .hpn{font-size:17px}
.app:not(.portrait) .textbox{height:92px;font-size:22px;padding:10px 40px 8px 18px}
.app:not(.portrait) .textbox small{font-size:13.5px}
.app:not(.portrait) .p-box{bottom:calc(92px + 7%)}
.infobox{position:absolute;background:var(--tb);border:2px solid var(--tbline);border-radius:12px 3px 12px 3px;padding:5px 10px 6px;box-shadow:var(--shadow);z-index:3}
.e-box{left:3%;top:5%;width:min(42%,260px)}
.p-box{right:3%;bottom:calc(74px + 8%);width:min(44%,270px)}
.infobox .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.infobox b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.infobox .lv{font-size:11px;color:var(--muted);white-space:nowrap}
.hprow{display:flex;align-items:center;gap:6px;margin-top:3px}
.hprow .hl{font-size:10px;font-weight:700;color:var(--sun)}
.hp{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:#3fae5a;transition:width .7s ease}
.hp i.mid{background:#e0a92a} .hp i.low{background:#d9452c}
.hpn{text-align:right;font-family:var(--display);font-size:14px;line-height:1.1;margin-top:1px}
.shieldtag{font-size:11px;color:var(--shield);font-weight:700;white-space:nowrap}

.textbox{position:absolute;left:1.5%;right:1.5%;bottom:10px;height:74px;background:var(--tb);border:3px double var(--tbline);border-radius:10px;
  padding:7px 34px 6px 14px;font-family:var(--display);font-size:18px;line-height:1.3;cursor:pointer;z-index:4;overflow:hidden}
.textbox small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.arrow{position:absolute;right:12px;bottom:6px;font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--display);font-size:42px;color:#fff;
  -webkit-text-stroke:1.5px var(--tbline);text-shadow:0 3px 0 var(--tbline);pointer-events:none;z-index:5;opacity:0}
.banner.on{animation:banner 1.2s ease}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.tint{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0}
.tint.on{animation:tint .8s ease}
@keyframes tint{25%{opacity:.55}100%{opacity:0}}
.proj{position:absolute;z-index:4;pointer-events:none;font-size:26px;line-height:1}
.boom{position:absolute;z-index:4;pointer-events:none;font-size:44px;transform:translate(-50%,-50%);animation:boom .5s ease-out forwards}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.laser{position:absolute;height:8px;border-radius:4px;transform-origin:0 50%;z-index:4;pointer-events:none;box-shadow:0 0 12px 4px var(--glow)}
.floater{position:absolute;font-family:var(--display);font-size:26px;pointer-events:none;z-index:6;transform:translate(-50%,-50%);animation:floatUp 1.1s ease-out forwards;
  -webkit-text-stroke:1px var(--tb);paint-order:stroke}
.floater.dmg{color:var(--danger)} .floater.good{color:#2f9a52} .floater.info{color:var(--sky);font-size:18px}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,calc(-50% - 44px))}}

/* ---------- status panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;min-height:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;line-height:1.1}
.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip.ok{border-color:var(--accent);color:var(--accent)} .chip.bad{border-color:var(--danger);color:var(--danger)}
.lvlist{display:flex;flex-direction:column;gap:2px}
.lvr{display:grid;grid-template-columns:minmax(0,1fr) 34px 56px 78px;gap:6px;align-items:center;padding:3px 6px;border-radius:7px;font-size:13.5px;transition:background .3s}
.lvr:nth-child(even):not(.head){background:var(--surface2)}
.lvr.head{font-size:11px;color:var(--muted);padding-block:0 2px;background:none}
.lvr.head span:not(:first-child){text-align:right}
.lvr.flash{background:color-mix(in srgb,var(--sun) 25%,var(--surface))!important}
.lvr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvr .nm em{font-style:normal;font-size:11px;color:var(--muted);margin-left:3px}
.lvr .now{font-family:var(--display);font-size:19px;text-align:right;line-height:1}
.lvr .dl{text-align:right;font-size:12.5px;font-weight:700;color:var(--muted)}
.lvr .dl.up{color:var(--accent)} .lvr .dl.down{color:var(--danger)}
.tagp{justify-self:end;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.tagp.ok{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tagp.warn{background:color-mix(in srgb,var(--sun) 20%,transparent);color:var(--sun)}
.tagp.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.tagp.none{color:var(--muted);font-weight:400}
.foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:20px;margin-left:4px}
.facs{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:54px minmax(0,1fr) 30px 66px;gap:8px;align-items:center;font-size:13.5px}
.bar{position:relative;height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar .fill{position:absolute;top:1px;bottom:1px;border-radius:3px;transition:left .5s,width .5s}
.bar .fill.good{background:var(--accent)} .bar .fill.bad{background:var(--danger)}
.bar::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--muted);opacity:.6}
.frow .val{font-family:var(--display);font-size:18px;text-align:right;line-height:1}
.frow .eff{font-size:12px;text-align:right;white-space:nowrap;font-weight:700;color:var(--muted)}
.frow .eff.good{color:var(--accent)} .frow .eff.bad{color:var(--danger)}
.facnote{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.facnote i{display:inline-block;width:18px;height:8px;border-radius:3px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--line);flex:none}

/* turn guide */
#guide{display:flex;flex-direction:column;justify-content:center;gap:8px}
.steps{display:flex;gap:6px;align-items:stretch}
.step{flex:1;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);min-width:0;transition:all .25s}
.step .no{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--line);color:var(--surface)}
.step b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1;color:inherit}
.step small{display:block;font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.now{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--surface));color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 25%,transparent)}
.step.now .no{background:var(--sun)}
.step.done{color:var(--accent)} .step.done .no{background:var(--accent)}
.app:not(.portrait) #guide{justify-content:stretch}
.app:not(.portrait) .steps{flex-direction:column;flex:1}
.app:not(.portrait) .step{flex:1;padding:4px 12px;gap:12px}
.app:not(.portrait) .step .no{width:32px;height:32px;font-size:19px}
.app:not(.portrait) .step b{font-size:19px}
.app:not(.portrait) .step small{font-size:12.5px;white-space:normal}
.app:not(.portrait) .busybar{flex:1;display:grid;place-items:center}
.gtitle{font-family:var(--display);font-size:18px;line-height:1.1}
.portrait .gtitle{display:none}
.busybar{font-family:var(--display);font-size:16px;text-align:center;color:var(--muted)}

/* ---------- hand strip ---------- */
.handzone{display:grid;grid-template-columns:86px minmax(0,1fr) 104px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:0}
.deck{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.deck:disabled{cursor:default}
.stack{position:relative;width:70px;height:96px}
.back{position:absolute;inset:0;border-radius:10px;border:2px solid var(--tbline);
  background:repeating-linear-gradient(45deg,#2f7d4f 0 7px,#3f9a62 7px 14px);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow)}
.back:nth-child(1){transform:translate(5px,5px)} .back:nth-child(2){transform:translate(2.5px,2.5px)}
.deck:not(:disabled) .stack{animation:dbob 1.3s ease-in-out infinite}
.deck:not(:disabled) .back:last-child{box-shadow:0 0 0 3px var(--sun),var(--shadow)}
@keyframes dbob{50%{transform:translateY(-4px)}}
.deck:disabled .stack{opacity:.5}
.decklabel{font-family:var(--display);font-size:13px;text-align:center;line-height:1.15}
.decklabel small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted)}
.draws{display:inline-block;background:var(--sun);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.hand{display:flex;gap:8px;overflow:visible;padding:10px 2px 4px;align-items:center;height:100%;min-width:0;position:relative}
.hand .empty{color:var(--muted);font-size:13px}
.card{flex:0 0 130px;height:180px;position:relative;text-align:left;border:2px solid var(--cc);border-radius:10px;background:var(--surface);padding:5px 7px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .15s ease;overflow:hidden}
.card:hover,.card:focus-visible{z-index:5;transform:translateY(-10px)}
.card:disabled{cursor:not-allowed}
.card:disabled > :not(.why){opacity:.4}
.card .ct{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--cc)}
.card .art{flex:1 1 auto;min-height:24px;border-radius:7px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--cc) 18%,var(--surface))}
.card .cn{font-family:var(--display);font-size:17px;line-height:1.1}
.card .ce{font-size:12px;font-weight:700;color:var(--cc);line-height:1.25}
.card .ce .cost{color:var(--danger)}
.card .cx{font-size:10.5px;line-height:1.3;color:var(--ink);background:var(--surface2);border-radius:5px;padding:2px 4px}
.card .why{font-size:11px;color:var(--danger);font-weight:700;line-height:1.2}
.card.drawn{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:translateX(-140px) rotateY(90deg);opacity:0}}
.endcol{display:flex;flex-direction:column;gap:6px}
.rule{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.35}

.cinematic .alien.enter{animation:cinemaEnter 450ms cubic-bezier(.23,1,.32,1)}
.cinematic .alien.faint{animation:faint 650ms ease forwards}
@keyframes cinemaHit{20%{transform:translateX(14px) rotate(3deg);filter:brightness(1.8) drop-shadow(0 0 20px #fff)}70%{transform:translateX(-3px)}}
@keyframes cinemaCharge{50%{transform:translateY(-8px) scale(1.04);filter:brightness(1.25) drop-shadow(0 0 23px #7de6ff)}}
@keyframes cinemaEnter{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.cinematic .eco{left:8%;bottom:36%;width:46%;height:31%;display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:0;z-index:3;pointer-events:none}
.cinematic .creature-unit{height:auto!important;font-size:inherit!important;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;position:relative;flex:0 1 170px;min-width:0}
.nature-sprite{width:100%;aspect-ratio:1;position:relative;overflow:hidden;filter:drop-shadow(0 7px 5px #0c2417a6)}
.species-0 .sprite-sheet{left:0;top:0}.species-1 .sprite-sheet{left:-100%;top:0}.species-2 .sprite-sheet{left:-200%;top:0}.species-3 .sprite-sheet{left:0;top:-100%}.species-4 .sprite-sheet{left:-100%;top:-100%}
.cinematic .erow .badge{margin:0;white-space:nowrap;background:#102c2bd9;border:1px solid #cfdbb35c;border-radius:4px;padding:4px 9px!important;font:12px var(--body)!important;color:#dbe6c9;box-shadow:0 5px 14px #0003}
.cinematic .erow .badge b{font-size:16px;color:#fff5cb;margin-left:7px}
.empty-ecosystem{color:#e5eedb;padding:14px;background:#0b262ab3;border:1px solid #bfd1b354;border-radius:8px}
.detail-panel{width:340px!important;z-index:20!important;top:88px!important;right:30px!important;bottom:auto!important;left:auto!important;background:#fffdf3f5;box-shadow:0 20px 65px #0008}
.field .textbox{left:34px;right:360px;bottom:229px;min-height:82px;height:auto;max-height:106px;border:1px solid #dbd2b46b;outline:none;border-radius:8px;background:linear-gradient(110deg,#0a242fea,#10282be6);color:#f8f1da;box-shadow:0 10px 35px #0005;padding:14px 35px 12px 18px!important;font-size:21px!important}
.field .textbox small{color:#c1d3ce;font-size:12.5px!important;line-height:1.5;margin-top:5px}
#guide{left:auto!important;right:30px;bottom:229px;width:300px;padding:8px;border:1px solid #d6cca94d;background:#0b252ce6;box-shadow:none;min-height:82px;color:#e8e6d7}
#guide .gtitle{display:none!important}#guide .steps{flex-direction:row!important;gap:5px}
#guide .step{padding:8px 5px!important;display:flex;flex-direction:column;gap:4px!important;text-align:center;border:0;border-radius:5px;background:transparent;color:#a2bbb3}
#guide .step .no{width:21px!important;height:21px!important;font-size:13px!important;background:#345551;color:#dce8db}
#guide .step b{font-size:14px!important}#guide .step small{display:none}
#guide .step.now{background:#ceae6430;color:#ffe5a1;box-shadow:none}#guide .step.now .no{background:#ba9753;color:#10272a}
#guide .step.done{color:#97c6aa}#guide .busybar{font-size:14px;min-height:65px;color:#c4d9cb;padding:8px}
.handzone{height:214px;background:linear-gradient(180deg,#04171a99,#071a22f5 45%);border-top:1px solid #c4bd945c;box-shadow:0 -20px 40px #06181b45;padding-top:12px;overflow:visible;z-index:10}
.hand{padding:0 55px;align-items:flex-end;padding-bottom:12px}
.hand .card{height:181px;flex-basis:128px;border:2px solid #c3a56b;border-radius:8px;background:linear-gradient(150deg,#fbf4d9,#d5d8bd);box-shadow:0 4px 0 #6c5838,0 9px 19px #0006;color:#203b32}
.card::before{border-radius:5px;border-color:#fff5d4b3}.card .ct{font-size:9px;color:#58745d}.card .cn{font-size:17px;color:#1a382f}
.card .art{background-color:#a0b58b;border:1px solid #58764d66;border-radius:4px;min-height:54px}
.card .card-species{position:relative;overflow:hidden;flex:1 0 58px;width:68px;align-self:center;border:0;background-color:transparent;border-radius:0;filter:drop-shadow(0 3px 2px #38533a44)}
.card .cx{background:#f9f2d2b3;font-size:10px;border-color:#bbbd9a}.card .ce{font-size:11px;color:#456a45}.card .why{font-size:10px;color:#8e4335}
.card:disabled>:not(.why){opacity:.6}
.back{background:radial-gradient(ellipse at 50% 45%,#527d6c,#193f41 52%,#112c32);border:2px solid #c8b37b;border-radius:7px;color:#d2d9ad;box-shadow:0 4px 10px #0007}
.back::after{content:"";position:absolute;inset:7px;border:1px solid #d4c28c80;border-radius:4px}.stack{width:72px;height:100px}
.decklabel{color:#e0dcc3}.draws{background:#c7a96a;color:#173133}.deck:disabled .stack{opacity:.65}
.endbtn,.endbtn.go{border:1px solid #dcc184;background:linear-gradient(145deg,#d2b36d,#957747);color:#102b2d;box-shadow:0 4px 0 #594b30;font-size:19px;border-radius:7px}
.handgrip{width:180px;height:106px;bottom:-27px;filter:drop-shadow(0 5px 8px #0006) brightness(.76) saturate(.6)}
.handgrip.left{left:24%}.handgrip.right{right:23%}
.proj{width:16px;height:16px;border-radius:50%;background:#f5ffe8;box-shadow:0 0 9px 4px var(--shot-color,#abefa2),0 0 32px 10px var(--shot-color,#abefa2);font-size:0}
.proj::before{content:"";position:absolute;right:4px;top:4px;width:45px;height:7px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--shot-color,#abefa2));transform-origin:right center}
.boom{width:64px;height:64px;border:3px solid #f5edbb;border-radius:50%;background:radial-gradient(circle,#fff8d6,transparent 65%);box-shadow:0 0 24px #e6f7b8;animation:cinemaImpact 380ms ease-out forwards}
@keyframes cinemaImpact{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
.laser{height:5px;box-shadow:0 0 18px 6px var(--glow)}
.floater{font-size:32px;text-shadow:0 3px 8px #07191c;-webkit-text-stroke:0}.floater.dmg{color:#ffd5bb}.floater.good{color:#c0f4a6}.floater.info{color:#d5f6fa}
.banner{font-size:48px;-webkit-text-stroke:0;text-shadow:0 5px 20px #061a23;color:#fff1bd}

.nature-sprite,.card-species{position:relative;overflow:hidden}

.main-menu::before{content:'';position:absolute;inset:17px;border:1px solid #687b5880;pointer-events:none}
.menu-sheet{position:absolute;left:5%;top:10%;width:41%;padding:42px;background:#f2e7cbf2;border:1px solid #6b7c5b;box-shadow:6px 7px 0 #53684e38}
.menu-eyebrow{font:12px var(--body);border-bottom:1px solid #a4af88;padding-bottom:18px;color:#778361}
.menu-sheet h1{font:82px/1.05 var(--display);font-weight:400;margin:28px 0 20px;color:#38523a;letter-spacing:-.03em}.menu-sheet h1 span{display:block;font-size:39px;margin-top:11px;letter-spacing:0}
.menu-sheet p{font:17px/1.8 var(--body);color:#6b785a;margin:25px 0}
.menu-actions{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 18px}.menu-actions button{border:1px solid #516849;border-radius:2px;background:#90a173;color:#2e492f;padding:13px 22px;cursor:pointer;font:18px var(--display);box-shadow:2px 3px 0 #52643e3b}.menu-actions button+button{background:#e7dfbd;font-size:16px}
.menu-actions button:hover{background:#b0ba8b}.menu-rules{font:11px var(--body);color:#81906c;margin-top:18px}.clear-stamp{display:inline-block;border:3px double #9f7258;padding:8px 12px;transform:rotate(-1deg);color:#956b50;font-size:11px;margin-top:10px}
.menu-specimen{position:absolute;left:50%;right:5%;top:19%;height:58%;padding:16px;background:#f2e7cbdf;border:1px solid #708360;box-shadow:5px 6px 0 #53684e30;transform:rotate(1deg)}
.menu-specimen img{width:100%;height:calc(100% - 25px);object-fit:contain}.menu-specimen span{display:block;border-top:1px solid #a5b089;text-align:center;padding-top:7px;font-size:11px;color:#7c8866}.main-menu footer{position:absolute;bottom:38px;left:0;right:0;text-align:center;color:#3f5b3c;font-size:13px}
#app.at-menu>.field,#app.at-menu>.top,#app.at-menu>.panel,#app.at-menu>.handzone{visibility:hidden}
.portrait .menu-sheet{left:6%;top:7%;width:88%;padding:30px}.portrait .menu-sheet h1{font-size:70px}.portrait .menu-specimen{top:auto;bottom:10%;left:15%;right:15%;height:32%}.portrait .menu-sheet h1 span{font-size:34px}.portrait .menu-sheet p{font-size:16px;margin:18px 0}.portrait .menu-actions{margin:22px 0 10px}
.portrait .story-plate{width:60%;height:51%;top:9%}.portrait .landscape-plate{width:83%;height:44%}.portrait .story-notebook{width:80%;padding:28px;top:12%}.portrait .stext{left:6%;right:6%;bottom:8%;font-size:19px;min-height:150px}
@media(prefers-reduced-motion:reduce){.cinematic .alien.hit .enemy-art,.cinematic .alien.charge .enemy-art{animation:none}}

/* ===== UX 개선 ===== */
.intent{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px;padding-top:6px;border-top:1px dashed #8a9a7a80;font-size:12px}
.intent:empty{display:none}
.intent .il{font-size:10px;opacity:.7;margin-right:2px}
.intent b{padding:2px 7px;border-radius:3px;font-weight:800}
.intent .atk{background:#a8533e;color:#fff6e8}
.intent .abil{background:#5b4a86;color:#f3ecff;cursor:help}
#dmgPrev small.rounded{display:block;font-size:10px;font-weight:600;opacity:.75;letter-spacing:0}

.hand .card{position:relative}
.hand .card:disabled{filter:grayscale(.75) brightness(.96)}
.hand .card:disabled>:not(.why){opacity:.45}
.hand .card .why{position:absolute;left:6px;right:6px;top:38%;margin:0;padding:6px;border-radius:4px;background:#7c3f33f2;color:#fff4e6!important;font-size:11px!important;font-weight:800;line-height:1.3;text-align:center;box-shadow:0 3px 8px #0004;z-index:2}
.skip{font-size:15px!important;padding:9px 16px!important;font-weight:700}
.skip kbd{font:inherit;font-size:11px;opacity:.65;margin-left:4px;border:1px solid currentColor;border-radius:3px;padding:0 4px}
.hdr-gap{display:inline-block;width:1px;height:20px;margin:0 12px 0 8px;background:#7c8b6c66;vertical-align:middle}
.card-flight{position:fixed;z-index:100;pointer-events:none;will-change:transform,opacity}
.card-flight .card{box-shadow:0 14px 30px #0005!important}
.portrait #field .textbox{top:226px!important}

/* ---- 전투 생동감 ---- */
.hp{position:relative}.hp i{position:relative;z-index:1}
.hp .ghost{position:absolute;left:0;top:0;bottom:0;width:100%;background:#f7e7b5;z-index:0;transition:width .8s cubic-bezier(.4,0,.2,1) .45s}
.hp.jolt{animation:jolt .35s}
@keyframes jolt{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.field::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;opacity:0}
.field.whiteflash::after{background:#fffbe9;animation:fieldFlash .22s ease-out}
.field.redflash::after{background:radial-gradient(ellipse at 50% 60%,transparent 35%,#b8402c 100%);animation:fieldFlash .6s ease-out}
@keyframes fieldFlash{0%{opacity:.75}100%{opacity:0}}
.floater.hitnum{font-family:var(--display)!important;font-weight:400;color:#b4472f!important;text-shadow:2px 2px 0 #fff4d8,-2px -2px 0 #fff4d8,2px -2px 0 #fff4d8,-2px 2px 0 #fff4d8,0 6px 12px #0004!important;animation:hitPop 1.15s cubic-bezier(.2,.9,.3,1.2) forwards;z-index:21}
.floater.crit{color:#d06a12!important}
.floater.big{font-size:40px!important}
@keyframes hitPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}28%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,calc(-50% - 26px))}100%{opacity:0;transform:translate(-50%,calc(-50% - 48px))}}
.taunt{position:absolute;z-index:19;transform:translate(-100%,-50%);max-width:220px;padding:9px 14px;background:#fffaf0;border:2px solid #34483a;border-radius:14px;font-weight:700;font-size:16px;color:#27392e;box-shadow:3px 4px 0 #34483a33;white-space:nowrap;animation:tauntIn .25s cubic-bezier(.2,.9,.3,1.3)}
.taunt::after{content:"";position:absolute;right:-10px;top:55%;border:8px solid transparent;border-left-color:#34483a}
.taunt.out{opacity:0;transition:opacity .25s}
@keyframes tauntIn{from{opacity:0;transform:translate(-100%,-50%) scale(.6)}}
.cinematic .alien.enraged:not(.hit):not(.charge):not(.faint):not(.enter) .enemy-art{animation:enraged 1.4s ease-in-out infinite}
@keyframes enraged{0%,100%{transform:translateY(0)}10%{transform:translate(-2px,-3px) rotate(-1deg)}20%{transform:translate(2px,-2px) rotate(1deg)}30%{transform:translate(-1px,-4px)}40%,90%{transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.field.whiteflash::after,.field.redflash::after,.hp.jolt,.alien.enraged .enemy-art{animation:none}.floater.hitnum{animation:floatUp 1.1s forwards}}

/* ===== 큰 글씨 · 큰 카드 (눈에 잘 보이게) ===== */
#app .handzone{height:340px!important;padding-top:10px!important;padding-bottom:8px!important}
#app .hand .card,#app .card-flight .card{width:196px!important;height:296px!important;flex:0 0 196px!important;padding:9px 10px!important;gap:5px!important}
#app .card .art{flex:0 0 118px!important;height:118px!important;min-height:118px!important}
#app .card .card-species{width:118px!important;height:118px!important;min-height:118px!important}
#app .card .ct{font-size:14px!important;font-weight:700}
#app .card .cn{font-size:29px!important;line-height:1.1}
#app .card .ce{font-size:17px!important;line-height:1.3;font-weight:800}
#app .card .cx{font-size:14.5px!important;line-height:1.4;min-height:0}
#app .hand .card .why{font-size:16px!important;top:30%}
#app .hand{padding-bottom:36px!important}
#app .decklabel{font-size:17px}#app .decklabel small{font-size:13px}#app .draws{font-size:14px}
#app #btnEnd{font-size:24px;padding:14px 18px;height:auto;width:150px}
/* 생태계 · 환경 칸 */
#app:not(.portrait) #pStat,#app:not(.portrait) #pFac{bottom:350px!important;height:100px!important}
#app .detail-panel .phead{height:22px!important;margin-bottom:6px!important}
#app .detail-panel h2{font-size:16px!important}
#app .detail-panel .chip{font-size:13px!important;padding:2px 7px!important}
#app #pStat .lvlist,#app #pFac .facs{height:52px!important}
#app #pStat .nm,#app #pFac .factor-name{font-size:16px!important;font-weight:700}
#app #pStat .now,#app #pFac .val{font-size:30px!important}
#app #pStat .foot::before{font-size:14px!important}#app #pStat .foot b{font-size:24px!important}
#app #pStat .foot{top:7px!important}
#app #pFac .frow{grid-template-columns:auto 30px 1fr!important}
#app #pFac .factor-name small{font-size:12px!important}
#app #pFac .eff{font-size:13px!important}#app #pFac .eff small{font-size:13px!important}
/* 안내 글 · 체력 */
#app #field .textbox{width:820px!important;height:auto!important;max-height:none!important;font-size:24px!important;line-height:1.35;padding:14px 20px!important}
#app #field .textbox small{font-size:17px!important;line-height:1.45}
#app .infobox b{font-size:28px!important}
#app .infobox .lv{font-size:14px!important}
#app .infobox .hpn{font-size:21px!important;font-weight:700}
#app .hprow .hl{font-size:15px!important}
#app .infobox .hp{height:12px!important}
#app .top button,#app .top .chip,#app .top .pill{font-size:16px!important}
#app .floater{font-size:40px!important}
#app .combat-label{font-size:32px!important}
.taunt{font-size:22px!important;max-width:none}
/* 가로 화면: 생물 무대를 칸 위로 올림 */
#app:not(.portrait) #eco{bottom:450px!important}
#app:not(.portrait) .cinema-scene{top:-99px!important;bottom:auto!important;height:100%!important}
#app:not(.portrait) #alien{margin-bottom:99px;height:24%!important}
#app:not(.portrait) #field .textbox{left:330px!important;transform:none!important;width:740px!important}
/* 세로 화면 */
#app.portrait .handzone{height:340px!important}
#app.portrait #pFac{bottom:350px!important;height:100px!important}
#app.portrait #pStat{bottom:462px!important;height:100px!important}
#app.portrait #btnEnd{width:100%;font-size:20px;padding:12px 6px}
#app.portrait .handzone{grid-template-columns:96px minmax(0,1fr) 110px!important}
#app.portrait #field .textbox{width:auto!important}
#app.portrait #pFac .frow{grid-template-columns:auto 26px 1fr!important;padding:3px 5px!important}
#app.portrait #pFac .eff,#app.portrait #pFac .eff small{font-size:11px!important}
</style>

</head>
<body>

  <header class="top">
    <div class="brand"><h1>생피 <span>초원의 기록</span></h1><small>관찰하고, 한 장씩 잇는 초원의 카드 이야기</small></div>
    <div class="toolbar">
      <span class="pill num" id="stagePill"></span>
      <button class="ghost" id="btnStat" type="button" aria-expanded="false" aria-controls="pStat">생태계</button>

<script>

const CARDS = {
  seed:  {name:'풀 씨앗', type:'bio', lv:0, rng:[4,10], icon:'', sci:'생산자는 광합성으로 양분을 스스로 만들어요. 모든 먹이 사슬의 출발점이에요.'},
  hopper:{name:'메뚜기 무리', type:'bio', lv:1, rng:[3,8], icon:'', sci:'메뚜기는 풀을 먹는 1차 소비자예요. 턴이 끝나면 풀을 먹어요.'},

  spring:{name:'따뜻한 햇살', type:'abio', factor:'temp', sign:1, rng:[1,2], icon:'', sci:'온도 +1에서는 풀 생장 +1, 추위나 폭염에서는 풀 생장 −3이에요.'},
  draw2:{name:'2장 더 뽑기',type:'utility',rng:[2,2],icon:'✦',sci:'카드 2장을 즉시 추가로 뽑아요. 생물 카드 사용 횟수는 소모하지 않아요.'},
  reset:{name:'패 리셋',type:'utility',rng:[5,5],icon:'↻',sci:'남은 손패를 모두 버리고 새 카드 5장을 뽑아요. 이번 턴 생물 카드 사용 횟수는 유지돼요.'},
  breeze:{name:'시원한 바람', type:'abio', factor:'temp', sign:-1, rng:[1,2], icon:'', sci:'온도를 낮춰 폭염으로 줄어든 풀 생장을 회복해요. 너무 낮추면 추위로 풀 생장이 줄어요.'},
};
// 카드 한 장마다 양이 달라요 (뽑을 때 정해짐)
function makeCard(id){const c=CARDS[id];return {id,n:rint(c.rng[0],c.rng[1])}}
function cardEff(card){
  const c=CARDS[card.id], n=card.n;
  if(c.type==='utility')return card.id==='draw2'?'카드 2장 추가':'패를 버리고 5장 뽑기';
  if(c.type==='bio') return `${LV[c.lv].name} +${n}`+(c.lv?` · <span class="cost">${LV[c.lv-1].name} ${n} 필요</span>`:'');
  return `${FAC[c.factor].name} ${c.sign>0?'+':'−'}${n}`;
}
function cardInfo(card){
  const c=CARDS[card.id], n=card.n;
  if(c.type==='utility')return card.id==='draw2'?'즉시 뽑기 · 생물 횟수 소모 없음':'남은 패 전부 교체 · 생물 횟수 유지';
  if(card.id==='seed') return ' 공격 0 · 모든 생물의 먹이';
  if(c.type==='bio') return ` 공격 ${LV[c.lv].atk}/마리 (+${LV[c.lv].atk*n})<br>적정: ${LV[c.lv-1].name} ≥ ${LV[c.lv].name}×2`;
  if(c.factor==='light')return '빛 +1당 풀 생장 +2<br>+3 과다: 풀 생장 −2';
  if(c.factor==='water')return '물 +1당 풀 생장 +2<br>물 +3: 홍수 · 풀 −3/턴';
  if(c.factor==='soil')return '토양 1당 풀 생장 +1<br>적정 0~+3 · 매 턴 1 회복';
  return c.sign>0?'온도 +1: 풀 생장 +1<br>추위·폭염: 풀 생장 −3':'온도를 낮춰 폭염을 막아요<br>적정 온도 0~+1';
}
// 덱 장수 제한 없음: 뽑을 때마다 아래 비율(가중치)로 무작위 카드가 나와요
const WEIGHTS = {seed:7, hopper:7, frog:5, snake:3, hawk:2, sun:3, rain:3, soil:2, spring:2, breeze:1, draw2:3, reset:2};
function randomCardId(){let t=Math.random()*Object.values(WEIGHTS).reduce((a,b)=>a+b,0);for(const [id,w] of Object.entries(WEIGHTS)){t-=w;if(t<0)return id}return 'seed'}

const ABIL = {

  drain:{name:'수분 흡수', col:'#b27a3a', say:'땅이 바싹 메말랐다! 물 −1', sci:'물이 없으면 광합성을 못 해서 풀이 덜 자라요.', apply(){addMod('water',-1)}},

// ================= 상태 =================
let S;
function newStage(stage, hp){
  S = {v:4, stage, turn:1, hp, maxhp:MAXHP, bossHp:BOSSES[stage].hp, bossMax:BOSSES[stage].hp,
    pop:[14,3,0,0,0], fac:{light:0,water:0,soil:0,temp:0}, draws:0, bioUsed:0, hand:[],
    intent:null, busy:false, over:false, crashes:0, justDrew:-1, popIn:null};
  S.intent = pickIntent(); dealCards(FIRST_DRAWS);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);return w+(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?a:b)}
function fmt(x){return Number.isInteger(x)?String(x):x.toFixed(1)}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}

// ================= 생태계 규칙 =================
function fv(f){return S.fac[f]}
function addMod(factor,amt){S.fac[factor]=Math.max(-3,Math.min(3,S.fac[factor]+amt))}
function environmentParts(){
  const L=fv('light'),W=fv('water'),T=fv('temp');
  return {light:L>=3?-2:L*2,water:W>=3?-3:W*2,soil:fv('soil'),temp:T<0||T>=2?-3:T===1?1:0};
}
function attackMultiplier(){return 1}
function growthParts(){const e=environmentParts(),parts=[['기본 생장',4],['빛',e.light],['물',e.water],['토양',e.soil],['온도',e.temp]];return {parts,total:Math.max(0,parts.reduce((sum,p)=>sum+p[1],0))}}
function settleEnvironment(){for(const f of Object.keys(FAC))S.fac[f]-=Math.sign(S.fac[f])}
function dealCards(count){let got=0;for(let i=0;i<count;i++){if(S.hand.length>=HANDMAX)break;S.hand.push(makeCard(randomCardId()));got++}S.justDrew=got?S.hand.length-1:-1;S.burned=count-got;return got}
function advanceTurnState(){S.turn++;S.bioUsed=0;S.draws=0;settleEnvironment();dealCards(DRAWS);S.intent=pickIntent();S.busy=false}
function pyramidOK(p){if(p[1]<=0) return false;for(let k=0;k<4;k++) if(p[k]<p[k+1]) return false;return true}
// 턴 끝: 환경에 따른 풀 생장 → 아래 단계부터 먹이 섭취 → 살아남은 소비자가 공격. 자동 번식 없음.
function simulate(){
  const p=S.pop.slice(),T=fv('temp'),cold=T<0,hot=T>=2;
  const grown=p.slice();grown[0]=Math.min(LV[0].cap,p[0]+growthParts().total);
  const bred=grown.slice(),avail=[0,0,0,0,0],next=grown.slice(),fed=[0,0,0,0,0],starve=[0,0,0,0,0],steps=[];
  for(let k=1;k<5;k++){
    avail[k]=next[k-1];fed[k]=Math.min(next[k],avail[k]);starve[k]=next[k]-fed[k];next[k-1]-=fed[k];next[k]=fed[k];steps[k]=next.slice();
  }
  // 먹이를 먹고 살아남은 소비자만 공격해요.
  const atk=[0,0,0,0,0];let dmgRaw=0,acc=0;
  for(let k=4;k>=1;k--){let a=next[k]*LV[k].atk;dmgRaw+=a;a*=attackMultiplier(k);const before=Math.floor(acc);acc+=a;atk[k]=Math.floor(acc)-before}
  return {atk,dmg:Math.floor(acc),raw:acc,dmgRaw:Math.floor(dmgRaw),growth:grown[0]-p[0],grown,bred,avail,next,fed,starve,steps,cold,hot};
}
function pickIntent(){
  const b=BOSSES[S.stage];
  const ab = S.turn%2===0 ? b.abil[rint(0,b.abil.length-1)] : null;
  return {ab, dmg:rint(b.atk[0],b.atk[1])+Math.floor((S.turn-1)/4)};
}

let cardFlying=false;
function canPlay(card){
  const c=CARDS[card.id], n=card.n;
  if(S.busy||S.over) return '';
  if(c.type==='bio'){
    if(S.bioUsed>=2) return '생물 카드는 턴당 최대 2장';
    if(S.pop[c.lv]>=LV[c.lv].cap) return '더 살 공간이 없어요';
    if(c.lv>0&&S.pop[c.lv-1]<n) return `${LV[c.lv-1].name} ${n} 필요 (지금 ${S.pop[c.lv-1]})`;
  }
  return null;
}
function drawCard(){
  if(cardFlying||S.busy||S.over||S.draws<=0||S.hand.length>=HANDMAX) return;
  const id=randomCardId(); S.hand.push(makeCard(id)); S.draws--; S.justDrew=S.hand.length-1;
  setMsg(`${CARDS[id].icon} ${CARDS[id].name} (${cardEff(S.hand[S.hand.length-1]).replace(/<[^>]+>/g,'')}) 카드를 뽑았다!`, S.draws>0?`남은 뽑기 ${S.draws}번 · 덱을 한 번 더 누르세요.`:'카드를 내고 턴 종료를 누르세요. 생물 카드는 최대 2장, 환경·전략 카드는 몇 장이든 낼 수 있어요.');
  render();
}
function play(i){
  const card=S.hand[i], id=card.id, c=CARDS[id], n=card.n;
  if(canPlay(card)!==null) return;
  S.hand.splice(i,1); S.justDrew=-1;
  if(c.type==='bio'){
    S.bioUsed++;
    const before=S.pop[c.lv];
    S.pop[c.lv]=Math.min(LV[c.lv].cap,S.pop[c.lv]+n);
    S.popIn={lv:c.lv,from:before};
    render(); summonCreature(c.lv); S.popIn=null;
    flashStat([c.lv]);
    floatAtRow(c.lv,`+${n}`,'good');
    if(c.lv>0){ setMsg(`가랏! ${c.icon} ${LV[c.lv].name} ${n}마리 등장! 턴이 끝나면 ${josa(LV[c.lv-1].name,'을','를')} 먹어요.`, c.sci); }
    else setMsg(`${c.icon} 풀 씨앗을 뿌렸다! 풀 +${n}`, c.sci);
  }else if(c.type==='utility'){
    const discarded=S.hand.length;
    if(id==='reset')S.hand=[];
    dealCards(id==='draw2'?2:FIRST_DRAWS);render();
    setMsg(id==='draw2'?(S.burned?`손패가 가득 차서(최대 ${HANDMAX}장) ${2-S.burned}장만 뽑았다.`:'카드 2장을 추가로 뽑았다!'):`남은 패 ${discarded}장을 버리고 새 카드 5장을 뽑았다!`,c.sci);
  }else{
    const amt=c.sign*n; addMod(c.factor,amt);
    render();
    floatAt(rel($('field')).w/2, 60, `${FAC[c.factor].icon} ${FAC[c.factor].name} ${amt>0?'+':''}${amt}`,'info');
    setMsg(`${c.icon} ${c.name}! ${cardEff(card)}`, c.sci);
  }
}

function fit(){
  const app=$('app'), vw=window.innerWidth, vh=window.innerHeight;

  app.classList.toggle('portrait',portrait);
  const W=portrait?900:900*vw/vh, H=portrait?Math.max(1100,900*vh/vw):900;

let storyNext=null;
function story(scenes){
  return new Promise(resolve=>{
    const box=$('story'); box.hidden=false;
    let i=0, typing=null, full='';
    function finish(){box.hidden=true;storyNext=null;resolve()}
    function show(){
      const sc=scenes[i];
      $('sdots').innerHTML=scenes.length>1?scenes.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join(''):'';
      box.classList.toggle('dark',!!sc.dark);
      if(sc.title){
        $('scene').innerHTML=MEADOW+`<div class="title"><h2>생피 카드게임</h2><p>먹이 사슬로 상대를 물리쳐라!</p><button class="startbtn" type="button">게임 시작</button></div>`;
        $('stextBox').hidden=true; $('skip').hidden=true; return;
      }
      $('stextBox').hidden=false; $('skip').hidden=false;
      $('scene').innerHTML=MEADOW+sc.art;
      $('speaker').hidden=!sc.speaker; $('speaker').textContent=sc.speaker||'';
      full=sc.text; let n=Math.min(6,full.length); $('stext').textContent=full.slice(0,n); $('sarrow').hidden=true;
      clearInterval(typing);
      if(reduced()){ $('stext').textContent=full; $('sarrow').hidden=false; typing=null; return; }
      typing=setInterval(()=>{n+=1;$('stext').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;$('sarrow').hidden=false}},24);
    }
    storyNext=()=>{
      if(typing){clearInterval(typing);typing=null;$('stext').textContent=full;$('sarrow').hidden=false;return}
      i++; if(i>=scenes.length) finish(); else show();
    };
    $('skip').onclick=e=>{e.stopPropagation();clearInterval(typing);finish()};
    show();
  });
}
$('story').addEventListener('click',()=>storyNext&&storyNext());
document.addEventListener('keydown',e=>{if($('story').hidden)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();storyNext&&storyNext()}else if(e.key==='Escape'){e.preventDefault();$('skip').click()}});

async function endTurn(){
  if(cardFlying||S.busy||S.over) return;
  S.busy=true; render();
  const b=BOSSES[S.stage], before=S.pop.slice(), sim=simulate(); let hits=0; const hp0=S.bossHp;

  // 1. 환경에 따른 생장과 먹이 섭취
  S.pop=sim.grown.slice();render();flashStat([0]);
  if(sim.growth){floatAtRow(0,`+${sim.growth}`,'good');await say(`환경의 영향으로 풀이 ${sim.growth} 자랐다!`, '이제 메뚜기부터 차례로 먹이를 먹어요. 먹고 살아남은 소비자만 공격해요.',900)}
  for(let k=1;k<5;k++){
    if(sim.bred[k]<=0)continue;
    const prey=LV[k-1].name,u=k===1?'':'마리';S.pop=sim.steps[k].slice();render();flashStat([k-1,k]);
    if(sim.fed[k])floatAtRow(k-1,`−${sim.fed[k]}`,'dmg');
    if(sim.starve[k]){S.crashes++;floatAtRow(k,`−${sim.starve[k]}`,'dmg')}
    await say(`${LV[k].icon} ${josa(LV[k].name,'이','가')} ${prey} ${sim.fed[k]}${u}를 먹었다!`+(sim.starve[k]?` 먹이 부족으로 ${sim.starve[k]}마리가 줄었다…`:''), `생물은 자동으로 늘어나지 않아요. 생물 카드로 보충하세요.`,850);
  }

  // 2. 살아남은 소비자의 공격
  if(sim.dmg>0){
    for(let k=4;k>=1;k--){
      if(!sim.atk[k]) continue;
      const row=document.querySelector(`.erow[data-lv="${k}"]`);
      setMsg(`${LV[k].icon} ${LV[k].name} ${S.pop[k]}마리의 공격!`);
      const strike=()=>{
        S.bossHp=Math.max(0,S.bossHp-sim.atk[k]);anim($('alien'),'hit');
        setTimeout(()=>$('alien').classList.remove('hit'),380);
        const ap=rel($('alien').querySelector('.enemy-art'));hits++;impact(sim.atk[k],ap,hits);render();
      };
      if(row)await fly(row,LV[k].icon,S.pop[k],strike);else strike();
      await say(`${LV[k].icon} ${LV[k].name} ${S.pop[k]}마리의 공격! ${b.name}에게 ${sim.atk[k]} 피해!`, attackMultiplier(k)!==1?`환경 영향: ${LV[k].name} 공격력 ×${attackMultiplier(k)}`:'', 900);
      if(S.bossHp<=0) break;
    }
  }else{
    await say('공격할 소비자가 없다…','먹이를 먹고 살아남은 소비자만 공격할 수 있어요.',1300);
  }
  if(hits>=2&&sim.dmg>0){combatLabel(`${hits}연속 공격 · 총 ${Math.round(hp0-S.bossHp)} 피해!`,'#f6c66b');await wait(700)}
  if(S.bossHp<=0){ko();anim($('alien'),'faint');await say(`${b.name}이(가) 쓰러졌다!`,'',700);S.busy=false;return stageClear()}

  // 5. 상대의 차례
  const it=S.intent, al=$('alien');
  if(it.ab){
    const ab=ABIL[it.ab];
    al.style.setProperty('--glow',ab.col); anim(al,'charge');
    banner(ab.name+'!',ab.col);
    await say(`${b.name}의 특수 능력 「${ab.name}」!`,'상대가 비생물 요소를 조종해요.',1100);
    const extra=ab.apply(); S.pop=S.pop.map(x=>Math.max(0,x)); render();
    await say(extra||ab.say, ab.sci,1600);
  }
  await taunt(); al.style.setProperty('--glow',b.skin.glow); anim(al,'charge');
  setMsg(`${b.name}의 ${b.attack}!`);
  await wait(300); await laser(b.skin.glow);
  const real=it.dmg;
  S.hp=Math.max(0,S.hp-real);
  const ep=rel($('eco')); floatAt(ep.x,ep.y-20,`−${real}`,'dmg big'); hurt(); render();
  await say(`${b.name}의 ${b.attack}! 나의 생태계에 ${real} 피해!`, '상대보다 먼저 쓰러뜨리려면 공격력을 키워야 해요.',1300);
  if(S.hp<=0){anim($('eco'),'faint');await say('나의 생태계가 무너졌다…','',1500);S.busy=false;render();return gameOver(false)}

  // 6. 다음 턴
  advanceTurnState(); render();
  setMsg(S.burned?`${S.turn}턴! 손패가 가득 차서(최대 ${HANDMAX}장) 카드 ${S.burned}장을 못 뽑았다.`:`${S.turn}턴! 카드 ${DRAWS}장을 자동으로 뽑았다.`, '생물 카드는 최대 2장, 환경·전략 카드는 몇 장이든 낼 수 있어요.');
}

async function intro(){
  const b=BOSSES[S.stage];
  S.busy=true; render(); anim($('alien'),'enter'); banner(`VS ${b.name}`,b.skin.glow); shakeField();
  await say(`앗! 상대 ${b.name}이(가) 나타났다!`, `직접 공격: ${b.attack} · 특수 능력: ${b.abil.map(a=>ABIL[a].name).join(', ')}`,1700);
  S.busy=false; render();
  setMsg(`카드 5장 준비 완료! 생물 카드를 최대 2장까지 내세요.`, '생물 카드는 최대 2장, 환경·전략 카드는 몇 장이든 낼 수 있어요.');
}
async function beginStage(stage){
  newStage(stage,MAXHP); render();
  await story(tauntScene(stage));
  intro();
}
async function stageClear(){
  S.over=true; render();
  const b=BOSSES[S.stage], last=S.stage===BOSSES.length-1;
  if(last){
    await story(ENDING);
    showMainMenu(true);
  }else{
    dialog(`<h2>${b.name} 격파!</h2>
      <p>${S.turn}턴 만에 이겼어요.</p>
      <div class="lesson"><b>오늘의 개념</b><br>${b.lesson}</div>
      <p>생태계는 처음 상태로 돌아가고 HP는 모두 회복돼요.</p>
      <div class="acts"><button class="endbtn go" type="button" data-act="next">다음 스테이지</button></div>`);
  }
}
function gameOver(forfeit){
  S.over=true; render();
  const tip=S.crashes>0
    ?'포식자를 먹이보다 많이 늘려서 굶어 죽은 적이 있어요. 굶은 소비자는 공격하기 전에 줄어드니, 아래 단계를 넉넉히 받쳐 주세요.'
    :'상대가 비생물 요소를 망가뜨리면 비생물 카드로 되돌려 보세요. 풀(생산자)을 넉넉히 키워야 동물들이 굶지 않아요.';
  dialog(`<h2>${forfeit?'기권했어요':'생태계가 무너졌어요'}</h2>
    <p>스테이지 ${S.stage+1}, ${S.turn}턴에서 게임이 끝났어요.</p>
    <div class="lesson"><b>다음엔 이렇게</b><br>${tip}</div>
    <div class="acts"><button class="ghost" type="button" data-act="main">메인 화면</button>
      <button class="endbtn go" type="button" data-act="retry">이 스테이지 다시</button></div>`);
}

function fanHand(){
  const h=$('hand'),cards=[...h.querySelectorAll('.card')],n=cards.length,many=n>10;h.classList.toggle('hand-many',many);if(!n)return;
  const W=h.clientWidth-30,cw=196,need=n*cw+(n-1)*10,ov=!many&&need>W&&n>1?(need-W)/(n-1)+10:0;
  cards.forEach((c,i)=>{c.style.marginLeft=i&&ov?`-${ov}px`:'';c.style.zIndex=i===S.justDrew?4:'';c.style.setProperty('--fan-angle',many?'0deg':`${(i-(n-1)/2)*Math.min(2.6,16/n)}deg`);c.style.setProperty('--fan-rise',many?'0px':`${Math.abs(i-(n-1)/2)*2}px`)});
}

  <ul>
    <li><b>처음에 5장, 이후 턴마다 2장</b>을 자동으로 뽑아요.</li>
    <li><b>생물 카드는 턴당 최대 2장.</b> 바로 아래 단계가 낼 수만큼 있어야 낼 수 있어요(예: 개구리 +3은 메뚜기 3 이상). 낼 때는 먹지 않고, 턴이 끝날 때 먹어요. 못 먹은 생물은 줄어들어요.</li>
    <li><b>비생물 카드</b>(햇빛·단비·토양·햇살·바람)는 몇 장이든 낼 수 있어요. 바로 풀이 늘지는 않고, 턴 끝에 풀이 자라는 양이 바뀌어요. 환경은 −3 ~ +3이며, 매 턴 종료 후 각 값이 0 쪽으로 1씩 회복돼요.</li>
    <li><b>턴 종료</b>: ① 풀이 자람 → ② 메뚜기 → 개구리 → 뱀 → 매 순서로 먹이를 섭취 → ③ <b>살아남은</b> 소비자들이 상대를 공격해요. 자동 번식은 없으며, 한 마리당 먹이 1이 필요해요. 부족하면 개체 수가 줄어요.</li>
    <li><b>공격력(한 마리당)</b>: 메뚜기 0.5 · 개구리 2 · 뱀 5 · 매 10</li>
    <li><b>풀 생장(턴마다)</b>: 기본 4 + 빛·물·토양·온도의 기여를 합쳐요. 자세한 값은 환경 줄에 표시됩니다. 풀 수에 비례한 증가는 없어요.</li>
    <li><b>다음 섭취</b>: 오른쪽 칸은 다음 턴에 먹을 때 먹이가 충분한지 미리 알려 줘요(충분 / 빠듯함 / 부족). 먹이가 포식자의 2배 이상이면 안정적이에요. 빛·물은 0~+2, 토양은 0~+3, 온도는 0~+1이 알맞아요.</li>
  </ul>
  <h3>환경별 영향 — 풀에만 적용</h3><ul><li><b>빛</b>: 수치당 풀 생장 +2. +3이면 과다로 −2.</li><li><b>물</b>: 수치당 풀 생장 +2. +3이면 홍수로 −3. 음수는 가뭄으로 생장이 줄어요.</li><li><b>토양</b>: 수치만큼 풀 생장에 가감해요.</li><li><b>온도</b>: 0은 정상, +1은 생장 +1, 음수나 +2 이상은 생장 −3.</li><li>동물 공격력은 환경에 따라 바뀌지 않아요. 환경이 풀을 바꾸고, 풀의 변화는 먹이 섭취를 통해 다른 생물에 영향을 줘요.</li><li>모든 환경은 턴 종료 후 0 쪽으로 1씩 돌아와요.</li></ul><h3>전략 카드</h3><ul><li><b>2장 더 뽑기</b>: 카드 2장을 즉시 추가로 뽑아요.</li><li><b>패 리셋</b>: 남은 패를 모두 버리고 새 카드 5장을 뽑아요. 생물 카드 사용 횟수는 초기화되지 않아요.</li></ul><h3>상대 차례</h3>
  <ul>
    <li>상대은 매 턴 <b>직접 공격</b>해서 내 HP를 깎아요.</li>
    <li>가끔 <b>특수 능력</b>으로 비생물 요소(빛·물·온도·토양)를 망가뜨려 생태계를 약하게 만들어요.</li>
  </ul>
  <h3>과학 개념</h3>
  <ul>
    <li><b>생물 피라미드</b>: 위 단계로 갈수록 에너지가 줄어서 아래 단계의 개체 수가 더 많아야 해요.</li>
    <li><b>생태계 평형</b>: 포식자가 늘면 먹이가 줄고, 먹이가 줄면 포식자가 굶어 줄어요. 그러면 먹이가 다시 늘어요.</li>
    <li><b>비생물 요소</b>: 빛·물은 광합성에, 토양은 양분에 영향을 줘요. 이 게임에서 환경은 풀 생장에만 직접 영향을 주며 동물 공격력은 바꾸지 않아요.</li>
  </ul>
  <h3>승리 · 패배</h3>
  <ul><li>상대 3명을 모두 물리치면 승리. 내 HP가 0이 되거나 기권하면 패배.</li>
  <li>배틀 중 글상자를 누르면 다음 메시지로 빨리 넘어가요.</li></ul>`;

$('dlg').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]')?.dataset.act; if(!a) return;
  closeDialog();
  if(a==='main'){showMainMenu();return}
  if(a==='begin') beginStage(0);
  if(a==='restart') beginStage(0);
  if(a==='retry'){newStage(S.stage,MAXHP);intro()}
  if(a==='next'){const n=S.stage+1;story(INTERLUDE[n]).then(()=>beginStage(n))}
  if(a==='forfeit') gameOver(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden&&$('dlg').querySelector('[data-act="close"]'))closeDialog()});
async function castCard(cardEl){
  if(cardFlying||cardEl.disabled)return;
  const i=+cardEl.dataset.i, card=S.hand[i];
  if(!card||canPlay(card)!==null)return;
  cardFlying=true;
  const c=CARDS[card.id];
  // 남은 카드 위치를 기억해 두었다가, 빈자리를 부드럽게 메워요.
  const oldPos=new Map();
  document.querySelectorAll('#hand .card').forEach(el=>{const j=+el.dataset.i;if(j!==i)oldPos.set(j>i?j-1:j,el.getBoundingClientRect())});
  if(!reduced()){
    const r=cardEl.getBoundingClientRect();
    const target=c.type==='bio'?($('eco').querySelector(`.erow[data-lv="${c.lv}"]`)||$('eco')):c.type==='abio'?$('pFac'):$('deck');
    const t=target.getBoundingClientRect();
    const shell=document.createElement('div');
    shell.className='card-flight';
    shell.style.left=r.left+'px';shell.style.top=r.top+'px';shell.style.width=r.width+'px';shell.style.height=r.height+'px';
    const face=cardEl.cloneNode(true);
    face.removeAttribute('id');face.removeAttribute('data-i');
    face.style.cssText=`margin:0;transform:scale(${SCALE});transform-origin:0 0`;
    shell.appendChild(face);document.body.appendChild(shell);
    cardEl.style.visibility='hidden';
    const dx=t.left+t.width/2-(r.left+r.width/2), dy=t.top+t.height/2-(r.top+r.height/2);
    const lift=Math.min(90,Math.abs(dy)*.35+40);
    try{
      await shell.animate([
        {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:1,filter:'brightness(1)'},
        {transform:'translate(0,-26px) rotate(0deg) scale(1.08)',opacity:1,filter:'brightness(1.08)',offset:.22},
        {transform:`translate(${dx*.55}px,${dy*.55-lift}px) rotate(${dx>0?6:-6}deg) scale(.82)`,opacity:1,offset:.62},
        {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.32)`,opacity:0,filter:'brightness(1.6)'}
      ],{duration:520,easing:'cubic-bezier(.33,0,.2,1)',fill:'forwards'}).finished;
    }catch(e){}
    shell.remove();
  }
  cardFlying=false;
  play(i);
  if(!reduced()){
    const tgt=c.type==='bio'?$('eco').querySelector(`.erow[data-lv="${c.lv}"]`):c.type==='abio'?$('pFac'):null;
    if(tgt){const p=rel(tgt);sparkle(p.x,p.y,c.type==='bio'?'#d9f8b4':'#bfe4ff',8)}
    document.querySelectorAll('#hand .card').forEach(el=>{
      const j=+el.dataset.i,o=oldPos.get(j);
      if(!o){el.animate([{opacity:0,translate:'0 30px'},{opacity:1,translate:'0 0'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});return}
      const n=el.getBoundingClientRect(),ddx=(o.left-n.left)/SCALE,ddy=(o.top-n.top)/SCALE;
      if(Math.abs(ddx)+Math.abs(ddy)<1)return;
      el.animate([{translate:`${ddx}px ${ddy}px`},{translate:'0 0'}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'});
    });
  }
}
$('hand').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)castCard(c)});
$('deck').addEventListener('click',drawCard);
for(const [button,panel] of [['btnStat','pStat'],['btnFac','pFac']]){
  $(button).setAttribute('aria-expanded','true');
  $(button).addEventListener('click',()=>{anim($(panel),'hud-highlight');setTimeout(()=>$(panel).classList.remove('hud-highlight'),700)});
}
$('btnEnd').addEventListener('click',endTurn);
$('btnHelp').addEventListener('click',()=>dialog(HELP+`<div class="acts"><button class="endbtn go" type="button" data-act="close">닫기</button></div>`));
$('btnForfeit').addEventListener('click',()=>{if(S.over||S.busy)return;dialog(`<h2>정말 기권할까요?</h2><p>기권하면 이번 게임은 패배로 끝나요.</p>
  <div class="acts"><button class="ghost" type="button" data-act="close">계속하기</button><button class="endbtn" type="button" data-act="forfeit">기권</button></div>`)});

// ================= 메인 화면과 전체 여정 =================
let campaignCleared=false;
try{campaignCleared=localStorage.getItem('saengpi-notebook-cleared')==='yes'}catch(e){}
function showMainMenu(cleared=false){
  if(cleared){campaignCleared=true;try{localStorage.setItem('saengpi-notebook-cleared','yes')}catch(e){}}
  S.busy=true;S.over=true;closeDialog();$('story').hidden=true;
  $('mainMenu').hidden=false;$('app').classList.add('at-menu');
  $('menuClear').hidden=!campaignCleared;
  $('menuStart').textContent=campaignCleared?'다시 첫 장부터':'처음 장을 펼치기';
  $('menuStart').focus();
}
async function runCampaign(){
  if($('mainMenu').hidden)return;
  $('mainMenu').hidden=true;$('app').classList.remove('at-menu');
  newStage(0,MAXHP);render();S.busy=true;
  await story(OPENING);await beginStage(0);
}
$('mainMenu').addEventListener('click',e=>{
  const action=e.target.closest('[data-menu]')?.dataset.menu;
  if(action==='new')runCampaign();
  if(action==='help')dialog(HELP+`<div class="acts"><button class="endbtn go" type="button" data-act="close">수첩 닫기</button></div>`);
});
function start(){fit();newStage(0,MAXHP);render();setMsg('');showMainMenu()}
start();

</script>
